<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0A07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HarmonyHands">
<meta name="application-name" content="HarmonyHands">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230C0A07'/%3E%3Cpath d='M9 18V6l10-2v12' fill='none' stroke='%23F2B94B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='6.5' cy='18' r='2.5' fill='%23F2B94B'/%3E%3Ccircle cx='16.5' cy='16' r='2.5' fill='%233FBFAE'/%3E%3C/svg%3E">
<title id="pageTitle">HarmonyHands — 和弦伴奏指法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 設計代幣:照抄 HarmonyMap(與 ScrollScore 同一套語意變數),同一系列的工具放在一起看是同一個產品 ══ */
:root{
  --bg:#0C0A07;
  --panel:#161209;
  --panel-2:#201A0F;
  --gold:#F2B94B;
  --gold-bright:#EFD48A;
  --brand-gold:#C9A24B;   /* 品牌名照 ScrollScore 原本的顏色(品牌名的 CSS 要跟 ScrollScore / HarmonyMap 逐項相同) */
  --note-gold:#F2B94B;
  --note-teal:#3FBFAE;
  --gold-fill:#F2B94B;
  --teal-fill:#3FBFAE;
  --on-fill:#16110A;
  --teal:#3FBFAE;
  --teal-bright:#8FFFF0;
  --ivory:#F4ECDA;
  --muted:#8A7D5F;
  --muted-bright:#B6A576;
  --line:#2A2415;
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --shadow-md:0 10px 26px rgba(0,0,0,.5);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-pill:999px;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-lg:16px;
  --fs-xl:19px;
  --fs-2xl:26px;
  --surface-glass:rgba(32,26,15,.88);
  --surface-inset:rgba(22,18,9,.55);
  --card-tint:rgba(255,255,255,.035);
  --stage-glow:#171208;
  --paper:#FFFDF6;        /* 樂譜紙張:深色/淺色主題都一樣 */
  color-scheme:dark;
}
/* ══ 淺色主題:同一組語意變數換一套值 ══ */
body.light{
  --bg:#FBF7EE;
  --panel:#F4EEE0;
  --panel-2:#EDE6D4;
  --gold:#856418;
  --gold-bright:#6B5115;
  --brand-gold:#856418;
  --teal:#0F5F56;
  --teal-bright:#0B463F;
  --ivory:#241E12;
  --muted:#6F6450;
  --muted-bright:#544B3B;
  --line:#D8CDB2;
  --shadow-sm:0 4px 14px rgba(90,72,30,.10);
  --shadow-md:0 10px 26px rgba(90,72,30,.14);
  --shadow-lg:0 18px 44px rgba(90,72,30,.18);
  --surface-glass:rgba(252,249,241,.92);
  --surface-inset:rgba(255,255,255,.7);
  --card-tint:rgba(133,100,24,.05);
  --stage-glow:#FFFDF6;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,[role="button"],.seg,.chips,.dg-wrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);color:var(--ivory);
  font-family:"Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;
}
/* ── 頂欄(照抄 HarmonyMap)───────────────────────── */
header{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:8px 14px;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.header-left,.header-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
/* 品牌名:這一組數值與 ScrollScore / HarmonyMap 完全相同 */
header h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(12px, 3.7vw, var(--fs-lg));
  letter-spacing:clamp(.02em, .55vw, .12em);
  font-weight:700;color:var(--brand-gold);white-space:nowrap;
  flex:none;
}
header h1 span{color:var(--ivory);font-weight:600}
.tagline{color:var(--muted);font-size:var(--fs-xs);letter-spacing:.04em;white-space:nowrap;line-height:17px}
@media (max-width:600px){ .tagline{display:none} }
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:8px 16px;height:38px;border-radius:var(--radius-pill);cursor:pointer;
  transition:background .2s,color .2s;white-space:nowrap;
}
.btn svg{flex:none}
.btn:active{background:var(--gold-fill);color:var(--on-fill)}
.btn.primary{background:var(--gold-fill);color:var(--on-fill);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted-bright)}
.btn.small{height:32px;padding:0 12px;font-size:var(--fs-sm)}
.btn[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
#themeToggle[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
#langToggle{aspect-ratio:1;padding:0}
#langToggle[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
@media (max-width:600px){
  header{padding:8px clamp(6px, 2.2vw, 10px);gap:clamp(4px, 1.4vw, 6px);flex-wrap:nowrap}
  .header-left,.header-right{gap:clamp(4px, 1.4vw, 6px)}
  .btn{padding:0 10px;height:34px;font-size:var(--fs-sm)}
}
@media (max-width:380px){ .btn{padding:0 8px;height:32px} }
@media (max-width:340px){ .btn{padding:0 5px} }
@media (max-height:420px){
  header{padding:5px 10px;gap:4px 8px}
  header h1{font-size:var(--fs-sm)}
  .btn{padding:0 10px;height:28px;font-size:var(--fs-xs)}
}

/* ── 版面:設定 → 樂譜 → 指法說明,由上到下 ── */
main{
  flex:1;display:flex;flex-direction:column;gap:14px;
  padding:14px;max-width:1400px;width:100%;margin:0 auto;min-width:0;
}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:14px 16px;min-width:0;
  background-image:linear-gradient(180deg, var(--card-tint), transparent 90px);
}
.card-title{
  font-size:var(--fs-2xs);letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.card-title b{font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);letter-spacing:.06em;color:var(--gold);text-transform:none;font-weight:700}
.card-title .sub{letter-spacing:.04em;text-transform:none;font-size:var(--fs-xs);color:var(--muted-bright);flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 樂器切換(兩段式) */
.seg{display:flex;gap:0;border:1px solid var(--gold);border-radius:var(--radius-pill);overflow:hidden}
.seg button{flex:1 1 0;min-width:0;height:36px;border:0;background:transparent;color:var(--gold);font-family:inherit;
  font-size:var(--fs-md);font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.seg button + button{border-left:1px solid var(--gold)}
.seg button[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill);font-weight:700}
/* 設定:桌機 6 欄兩排(樂器・風格・進行・調・反覆 / 左手・右手・速度);窄螢幕兩欄 */
.setup{padding:10px 14px 12px}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field[hidden]{display:none}
.field.wide{grid-column:span 2}
.field.gtr{grid-column:span 3}
.field label{font-size:var(--fs-2xs);color:var(--muted-bright);letter-spacing:.04em}
.field select,.field input{
  width:100%;min-width:0;height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-inset);color:var(--ivory);font-family:inherit;font-size:var(--fs-md);padding:0 10px;
}
.field select:focus,.field input:focus{outline:none;border-color:var(--gold)}
.tempo-row{display:flex;gap:6px;align-items:center}
.tempo-row input{flex:1 1 auto;text-align:center}
.tempo-row .btn{flex:none;width:36px;padding:0;height:36px}
/* 手機:設定收成一行摘要(點了展開),練習卡片與樂譜不用往下滑就看得到 */
.setup-summary{display:none;width:100%;align-items:center;gap:8px;border:0;background:transparent;color:var(--ivory);
  font-family:inherit;font-size:var(--fs-sm);text-align:left;cursor:pointer;padding:2px 0;min-height:30px}
.setup-summary span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup-summary svg{flex:none;color:var(--gold)}
.setup.open .setup-summary .chev{transform:rotate(180deg)}
@media (max-width:900px){
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field.wide,.field.gtr{grid-column:span 1}
  .field.gtr{grid-column:span 2}
  #fTone{order:7} #fLoops{order:8} #fTempo{order:9}
}
@media (max-width:600px){
  .setup{padding:8px 12px}
  .setup-summary{display:flex}
  .setup:not(.open) .setup-body{display:none}
  .setup.open .setup-body{margin-top:8px}
  .tempo-row .btn{width:34px;height:36px}
}

/* 練習卡的標題列:標題 + 播放/循環/預備拍 */
.stage-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:6px}
.stage-head > b{font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);letter-spacing:.06em;color:var(--gold);font-weight:700}
.stage-head .sub{font-size:var(--fs-xs);color:var(--muted-bright);min-width:0;flex:1 1 120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport{display:flex;align-items:center;gap:6px;margin-left:auto}
.transport .btn.primary{min-width:84px}
.status{font-size:var(--fs-2xs);color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
@media (max-width:600px){
  .transport .btn-label{display:none}
  .transport .btn.small{padding:0 9px}
  .status{max-width:96px}
}
details.card > summary{list-style:none;cursor:pointer;margin-bottom:0}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary .chev{margin-left:auto;color:var(--gold);transition:transform .2s}
details.card[open] > summary{margin-bottom:10px}
details.card[open] > summary .chev{transform:rotate(180deg)}

.paper{background:var(--paper);border-radius:var(--radius-sm);padding:8px 4px;min-height:160px;overflow:hidden;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
#osmd{width:100%;color:#16130D}
.paper-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6f6450;font-size:var(--fs-sm);padding:16px;text-align:center}
.paper-msg:empty{display:none}

/* 指法說明 */
.legend{font-size:var(--fs-sm);line-height:1.75;color:var(--muted-bright);margin-bottom:12px}
.legend b{color:var(--ivory);font-weight:700}
.legend .t{display:inline-block;min-width:1.6em;text-align:center;padding:0 4px;border-radius:6px;background:var(--surface-inset);
  border:1px solid var(--line);color:var(--gold);font-weight:700;margin:0 2px}

/* ── 練習:和弦卡片(照 HarmonyMap 練習模式的卡片)──
   一步一張,橫向排;張數多時這一排自己左右捲(頁面不會橫向捲動)。手機直式一次一張、滑動切換 */
.stage-row{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:10px 10px 16px;margin:-6px -10px 0;   /* 內距留給外框光暈,不會被捲動容器切掉 */
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior-x:contain}
.scard{flex:0 0 clamp(220px, calc((100% - 30px) / 4), 340px);scroll-snap-align:center;min-width:0;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-inset);padding:10px 12px 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s,box-shadow .2s}
.scard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px 2px rgba(242,185,75,.35)}
.scard-head{display:flex;align-items:baseline;justify-content:center;gap:8px;min-width:0;max-width:100%}
.scard-name{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(24px,2.4vw,32px);line-height:1.1;color:var(--muted-bright);white-space:nowrap}
.scard.on .scard-name{color:var(--gold-bright)}
.scard-sub{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 右手、左手:卡片夠寬時排在同一橫排,不夠寬才換行 */
.scard-hands{display:flex;flex-wrap:wrap;gap:2px 16px;width:100%}
.scard-hands .scard-row{flex:1 1 130px}
.scard svg{display:block;width:100%;height:auto}
.scard svg.gb{max-width:150px}
.scard-row{display:flex;gap:6px;align-items:baseline;font-size:var(--fs-sm);width:100%;min-width:0}
.scard-row span{flex:none;font-size:var(--fs-2xs);color:var(--muted);width:2.6em}
.scard-row i{font-style:normal;color:var(--ivory);min-width:0;overflow-wrap:anywhere}
.scard-row em{font-style:normal;font-size:var(--fs-2xs);color:var(--teal);margin-left:auto;flex:none;padding-left:4px}
/* 鋼琴小鍵盤:顏色照 HarmonyMap(根音金、其他和弦音青);正在彈的鍵再亮一層 */
svg.kb .w{fill:#FFFDF6;stroke:#8A7D5F;stroke-width:.6}
svg.kb .bk{fill:#1C1A16}
svg.kb .w.r{fill:#F2B94B} svg.kb .w.t{fill:#3FBFAE}
svg.kb .bk.r{fill:#BC8A1C} svg.kb .bk.t{fill:#2FA897}
/* 播放中:目前這張卡上「沒在響」的和弦音退成淡色,正在響的維持原本的飽和色 + 光暈,一眼看得出現在按哪幾個鍵 */
#stageRow.playing .scard.on svg.kb .w.r:not(.hit){fill:#F3E2BE} #stageRow.playing .scard.on svg.kb .w.t:not(.hit){fill:#CDEBE6}
#stageRow.playing .scard.on svg.kb .bk.r:not(.hit){fill:#8A7448} #stageRow.playing .scard.on svg.kb .bk.t:not(.hit){fill:#3F756E}
svg.kb .r.hit{filter:drop-shadow(0 0 5px rgba(242,185,75,.95))}
svg.kb .t.hit{filter:drop-shadow(0 0 5px rgba(63,191,174,.95))}
svg.kb .hb{fill:none;stroke:var(--muted);stroke-width:1.2}
svg.kb .hl{fill:var(--muted-bright);font:600 12px "Noto Sans TC",sans-serif;text-anchor:middle}
/* 吉他和弦圖:照 HarmonyMap(點的顏色依音:根音金、其他青;數字 = 左手手指),下方是右手撥這條弦的手指 */
svg.gb .ln{stroke:var(--muted-bright);stroke-width:1.6}
svg.gb .str{stroke:var(--muted-bright);transition:stroke .08s}
svg.gb .nut{stroke:var(--muted-bright);stroke-linecap:square}
svg.gb .bg{fill:var(--surface-inset)}
svg.gb .brr{fill:var(--muted-bright);opacity:.55}
svg.gb .fn{fill:#16130D;font:700 10px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .mx{fill:var(--muted);font:600 13px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .fr{fill:var(--muted);font:500 10px "Noto Sans TC",sans-serif}
svg.gb .tok{fill:var(--muted-bright);font:700 13px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .tokl{fill:var(--muted-bright);font:600 11px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .str.hit{stroke:var(--gold);stroke-width:3.2}
svg.gb .tok.hit{fill:var(--gold)}
svg.gb .fd.hit,svg.gb .od.hit{filter:drop-shadow(0 0 4px rgba(255,236,190,.95))}
/* 一小節的節奏格:播放時亮起來的一欄是現在 */
.grid{display:grid;grid-template-columns:2.8em repeat(var(--n,8),minmax(0,1fr));gap:3px;margin-top:6px}
.grid .h{font-size:var(--fs-2xs);color:var(--muted);text-align:center;line-height:16px}
.grid .h.beat{color:var(--muted-bright);font-weight:700}
.grid .lab{font-size:var(--fs-2xs);color:var(--muted);align-self:center;white-space:nowrap}
.grid .c{height:42px;border-radius:6px;background:var(--surface-inset);border:1px solid var(--line);min-width:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-lg);font-weight:700;color:var(--ivory);line-height:1.05}
.grid .c small{font-size:10px;font-weight:500;color:var(--muted)}
.grid .c.hold{background:rgba(242,185,75,.08);border-color:transparent}
.grid .c.on{border-color:var(--muted-bright)}
.grid .c.now{background:rgba(242,185,75,.2);border-color:var(--gold)}
.grid .c.now.on{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill)}
.grid .c.now.on small{color:var(--on-fill)}
#scoreToggle{margin-left:auto}
#scoreToggle svg{transition:transform .2s}
#scoreToggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.paper[hidden]{display:none}
@media (max-width:600px){
  .scard{flex-basis:100%}
  .scard svg.gb{max-width:170px}
  .grid{grid-template-columns:2.4em repeat(var(--n,8),minmax(0,1fr));gap:2px}
  .grid .c{height:34px;font-size:var(--fs-sm);border-radius:5px}
  .grid .c small{font-size:9px}
}
/* 手機橫向:卡片與節奏格壓扁,一個畫面放得下卡片 + 節奏格 */
@media (max-height:420px) and (min-width:601px){
  .scard{flex-basis:clamp(170px, calc((100% - 30px) / 4), 300px);padding:8px 10px 8px;gap:3px}
  .scard-name{font-size:24px}
  .scard-row{font-size:var(--fs-xs)}
  .grid .c{height:26px;font-size:var(--fs-xs)}
  .grid .h{line-height:12px}
  .stage-head{margin-bottom:2px}
  .scard svg.gb{max-width:104px}
}
footer{max-width:1400px;width:100%;margin:0 auto;padding:6px 16px 28px;font-size:var(--fs-xs);line-height:1.8;color:var(--muted)}
footer a{color:var(--muted-bright)}
footer b{color:var(--muted-bright);font-weight:500}

/* 背景的兩團淡光(照 HarmonyMap) */
body{background:
  radial-gradient(ellipse 70% 45% at 0% 100%, rgba(242,185,75,.075), transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%, rgba(63,191,174,.06), transparent 70%),
  var(--bg);background-attachment:fixed}
body.light{background:
  radial-gradient(ellipse 70% 45% at 0% 100%, rgba(242,185,75,.16), transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%, rgba(63,191,174,.12), transparent 70%),
  var(--bg);background-attachment:fixed}
.btn.primary{box-shadow:0 6px 22px -8px rgba(242,185,75,.8)}
.btn,.seg button{transition-property:background,color,border-color,box-shadow,transform;transition-duration:.15s,.15s,.15s,.2s,.09s}
.btn:active,.seg button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
@media (max-width:600px){
  main{padding:10px;gap:10px}
  .card{padding:12px}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Harmony<span>Hands</span></h1>
    <span class="tagline" data-i18n="tagline">和弦伴奏指法</span>

const ACC_LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
const ACC_KEYS = {   // [主音, 調號升降數]

// 和弦音的字母:音程(半音)→ 比根音高幾個字母。音名一律「字母照級數推、升降照音高差算」,不查表(Cdim7 才不會拼錯)
const ACC_IV_LETTER = { 0: 0, 2: 1, 3: 2, 4: 2, 7: 4, 9: 5, 10: 6, 11: 6 };

function accParseRoman(tok){
  const m = /^([b#]?)(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(maj7|7)?(?:\/(b?\d))?$/.exec(tok);
  if (!m) throw new Error("bad roman " + tok);
  const minor = m[2] === m[2].toLowerCase();
  let ivs, kind, kt;
  if (!minor) {
    if (m[3] === "7") { ivs = [0,4,7,10]; kind = "dominant"; kt = "7"; }
    else if (m[3] === "maj7") { ivs = [0,4,7,11]; kind = "major-seventh"; kt = "maj7"; }
    else { ivs = [0,4,7]; kind = "major"; kt = ""; }
  } else if (m[3] === "7") { ivs = [0,3,7,10]; kind = "minor-seventh"; kt = "m7"; }
  else { ivs = [0,3,7]; kind = "minor"; kt = "m"; }
  return { deg: ACC_ROMAN.indexOf(m[2].toUpperCase()), acc: m[1] === "b" ? -1 : m[1] === "#" ? 1 : 0, ivs, kind, kt,
           bassIv: m[4] ? ({ "3": ivs[1], "5": 7, "b7": 10, "7": 11 })[m[4]] : 0, roman: tok };
}
function accNameParts(name){
  const li = ACC_LETTERS.indexOf(name[0]);
  const alter = name.includes("#") ? 1 : name.length > 1 && name[1] === "b" ? -1 : 0;
  return { li, pc: (ACC_MAJ[li] + alter + 12) % 12 };
}
function accAlterOf(li, pc){ let d = ((pc - ACC_MAJ[li]) % 12 + 12) % 12; if (d > 6) d -= 12; return d; }
function accPcName(li, pc){
  const a = accAlterOf(li, pc);
  return ACC_LETTERS[li] + (a > 0 ? "♯".repeat(a) : a < 0 ? "♭".repeat(-a) : "");
}
function accSpell(p){   // {midi, li} → MusicXML step/alter/octave
  const alter = accAlterOf(p.li, ((p.midi % 12) + 12) % 12);
  return { step: ACC_LETTERS[p.li], alter, octave: Math.round((p.midi - alter - ACC_MAJ[p.li]) / 12) - 1 };
}
function accKeyFor(minor, tonic){
  const mode = minor ? "minor" : "major";
  const [tonicName, fifths] = ACC_KEYS[mode].find(k => k[0] === tonic) || ACC_KEYS[mode][0];
  return { ...accNameParts(tonicName), fifths, name: tonicName, mode };
}
// 依調把羅馬數字變成實際和弦(含拼法)
function accRealize(rn, key){
  const rootLi = (key.li + rn.deg) % 7, rootPc = (key.pc + ACC_MAJ[rn.deg] + rn.acc + 12) % 12;
  const tone = iv => ({ iv, pc: (rootPc + iv) % 12, li: (rootLi + ACC_IV_LETTER[iv % 12]) % 7 });
  const tones = rn.ivs.map(tone), bass = tone(rn.bassIv);
  const name = accPcName(rootLi, rootPc) + rn.kt + (rn.bassIv ? "/" + accPcName(bass.li, bass.pc) : "");
  return { ...rn, rootLi, rootPc, tones, bass, tone, name };
}
// 右手聲位:所有轉位(密集排列)裡挑跟上一個和弦距離最小的(共同音不動、其他音走最近);第一個和弦挑最接近中心音高的
function accVoiceRH(tones, prev, lo, hi, center, starts){
  let best = null, bestCost = Infinity;
  const n = tones.length;
  for (let r = 0; r < n; r++) {
    if (starts && !starts.includes(tones[r].iv % 12)) continue;   // 爵士無根音只用 3-5-7-9 / 7-9-3-5 兩種排法
    const order = tones.slice(r).concat(tones.slice(0, r));
    for (let base = lo; base < lo + 12; base++) {
      if (base % 12 !== order[0].pc) continue;
      const v = [{ ...order[0], midi: base }];
      for (let i = 1; i < n; i++) { let m = v[i - 1].midi + 1; while (m % 12 !== order[i].pc) m++; v.push({ ...order[i], midi: m }); }
      if (v[n - 1].midi > hi) continue;
      const mean = v.reduce((s, x) => s + x.midi, 0) / n;
      let cost = 0.25 * Math.abs(mean - center);
      if (prev) {
        for (const x of v) cost += Math.min(...prev.map(p => Math.abs(p.midi - x.midi)));
        for (const p of prev) cost += Math.min(...v.map(x => Math.abs(p.midi - x.midi)));
      } else cost += Math.abs(mean - center);
      if (cost < bestCost) { bestCost = cost; best = v; }
    }
  }
  return best;
}
function accInvLabel(v, jazz){
  const iv = v[0].iv;
  if (jazz) return iv === 3 || iv === 4 ? L("A型", "A") : L("B型", "B");
  return iv === 0 ? L("原位", "Root") : (iv === 3 || iv === 4) ? L("一轉", "1st") : iv === 7 ? L("二轉", "2nd") : L("三轉", "3rd");
}
function accPlace(pc, lo){ let m = lo; while (m % 12 !== pc) m++; return m; }
function accAbove(pc, from){ let m = from + 1; while (m % 12 !== pc) m++; return m; }

function gtrBookFingers(frets){
  if (!gtrBookFingers.map) {

    for (const e of FINGER_BOOK.split(" ")) { const i = e.indexOf(":"); gtrBookFingers.map.set(e.slice(0, i), e.slice(i + 1)); }
  }
  const c36 = f => f < 0 ? "x" : f.toString(36), on = frets.filter(f => f > 0);
  const key = frets.includes(0) ? "o" + frets.map(c36).join("") : on.length ? "r" + frets.map(f => f < 0 ? "x" : c36(f - Math.min(...on))).join("") : "";

function accGtrShape(pc, kt, bassPc){
  let shape;

  if (open) shape = { frets: [...open[0]].map(c => c === "x" ? -1 : +c), fingers: [...open[1]].map(Number), open: true };
  else {
    const rE = ((pc - 4) % 12 + 12) % 12 || 12, rA = ((pc - 9) % 12 + 12) % 12 || 12;
    const [type, r] = rA <= rE ? ["A", rA] : ["E", rE];
    const [rel, fing] = ACC_GTR_BARRE[type][kt];
    shape = { frets: rel.map(f => f < 0 ? -1 : f + r), fingers: fing.slice(), open: false, barre: r };
  }
  shape = accGtrSlash(shape, bassPc);

function accGtrSlash(shape, bassPc){
  const fr = shape.frets, low = fr.findIndex(f => f >= 0);
  if ((ACC_GTR_OPEN_MIDI[low] + fr[low]) % 12 === bassPc) return shape;

      if (f > 0 && (Math.abs(f - minF) > 3 || Math.abs(f - maxF) > 3)) continue;

/* ══ 產生 → 預覽、練習卡片、指法說明、樂譜 ══
   主畫面是練習卡片:一步一張,鋼琴畫小鍵盤、吉他畫和弦圖,下方一排節奏格;播放時正在彈的鍵/弦再亮一層。

  normalizeState();

  curGen = accGenerate(state);
  selStep = Math.min(selStep, curGen.passLen);
  if (!keep && !opts.keepSel) selStep = 0;
  if (keep) {
    if (nextBar != null && nextBar >= curGen.bars.length) nextBar = state.loop ? 0 : curGen.bars.length - 1;
    const gen = curGen;

      + `<div class="scard-row"><span>${esc(L("左手", "LH"))}</span><i>${esc(st.lh.join(" "))}</i></div></div></div>`).join("");

function stepBar(step){ const g = curGen; return step >= g.passLen ? g.bars[g.bars.length - 1] : g.bars[step]; }
function gridSize(){ return curGen.bars.some(b => b.notes.some(n => n.at % 2)) ? 16 : 8; }
/* 一小節的節奏格:鋼琴兩排(右手 ● / 左手音名)、吉他一排(右手手指 + 第幾弦);延長中的格子淡淡上色 */
function renderGrid(step){
  const bar = stepBar(step), n = gridSize(), u = 16 / n, isG = curGen.guide.inst === "guitar";
  const heads = n === 8 ? ["1", "&", "2", "&", "3", "&", "4", "&"] : ["1", "e", "&", "a", "2", "e", "&", "a", "3", "e", "&", "a", "4", "e", "&", "a"];
  let h = `<span class="lab"></span>` + heads.map((x, i) => `<span class="h${i % (n / 4) === 0 ? " beat" : ""}">${x}</span>`).join("");
  const rows = isG ? [["G", L("右手", "RH")]] : [["R", L("右手", "RH")], ["L", L("左手", "LH")]];
  for (const [hand, label] of rows) {
    h += `<span class="lab">${esc(label)}</span>`;
    const mine = bar.notes.filter(x => isG || x.hand === hand);
    for (let c = 0; c < n; c++) {
      const at = mine.filter(x => x.at >= c * u && x.at < (c + 1) * u);
      const hold = !at.length && mine.some(x => x.at < c * u && x.at + x.dur > c * u);
      let txt = "";
      if (at.length) {
        if (isG) {   // 「T+2」= 拇指和中指同時;「123」= 三指同時;小字是第幾弦
          const toks = [...new Set(at.map(x => x.tok))], fing = toks.filter(t => t !== "T").join("");
          txt = toks.includes("S") ? "↓" : (toks.includes("T") ? "T" + (fing ? "+" : "") : "") + fing + `<small>${at.map(x => 6 - x.str).join("")}</small>`;
        }
        else if (hand === "R") txt = "●";
        else txt = [...new Set(at.map(x => x.nm))].join("");
      }
      h += `<span class="c${at.length ? " on" : hold ? " hold" : ""}" data-c="${c}">${txt}</span>`;
    }
  }
  const el = $("grid");
  el.style.setProperty("--n", n);
  el.innerHTML = h;
  el.setAttribute("aria-label", isG ? L("右手節奏:T 1 2 3,小字是第幾弦", "Right-hand rhythm: T 1 2 3, small digits = string") : L("左右手節奏", "Rhythm of both hands"));
  gridCell = -1;
}
function setActiveStep(step, scroll){

/* 點卡片聽這個和弦:鋼琴整個按下去、吉他從低音弦刷下去 */
let auditionToken = 0;
async function audition(step){
  if (playing) return;
  const gen = curGen, token = ++auditionToken, isG = gen.guide.inst === "guitar";
  ensureAudio();
  try { await audioCtx.resume(); } catch (e) {}
  try { await loadSamplesFor(gen, p => { if (token === auditionToken) setStatus(T(isG ? "loadingGuitar" : "loadingPiano", { pct: Math.round(p * 100) })); }); }
  catch (e) { if (token === auditionToken) setStatus(T("loadFail")); return; }
  if (token !== auditionToken || playing || gen !== curGen) return;
  setStatus(T("ready"));
  masterOut.gain.cancelScheduledValues(0); masterOut.gain.value = 1;
  const bar = stepBar(step), t = audioCtx.currentTime + 0.04;
  const hits = [];
  if (isG) {

    [...byStr.entries()].sort((a, b) => a[0] - b[0]).forEach(([s, m], i) => { playGuitarNote(m, t + i * 0.022, t + 2.2, 84, s, 0.5); hits.push({ s }); });
  } else {
    [...new Set(bar.notes.map(n => n.midi))].sort((a, b) => a - b).forEach((m, i) => { playPianoNote(m, t + i * 0.006, t + 1.4, t + 1.8, 62, true); hits.push({ m }); });
  }
  showHits(step, hits);
  setTimeout(() => { if (!playing && token === auditionToken) clearHits(); }, 900);
}

/* ── 樂譜(選用):OSMD 2.0.0 打開時才從 jsdelivr 載入;鋼琴大譜表,吉他五線譜 + 六線譜 ── */
const OSMD_URL = "https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.0.0/build/opensheetmusicdisplay.min.js";
let osmd = null, osmdLib = null, cursorSteps = [], cursorIdx = 0, osmdZoom = 0;

function osmdZoomFor(){ const w = $("osmd").clientWidth || innerWidth; return w < 420 ? 0.5 : w < 700 ? 0.66 : 0.9; }

$("scoreToggle").addEventListener("click", () => {

async function renderScore(){

/* 畫完後走一遍游標,記下每一步的時間點(全音符為單位;一小節 = 1),播放時對時間找位置 */
function collectCursorSteps(){
  const c = osmd.cursor;
  if (!c) { cursorSteps = []; return; }
  c.show(); c.reset();
  cursorSteps = [];
  let guard = 0;
  while (!c.Iterator.EndReached && guard++ < 5000) { cursorSteps.push(c.Iterator.currentTimeStamp.RealValue); c.next(); }
  c.reset(); cursorIdx = 0;
}
function moveCursorTo(idx){
  const c = osmd && osmd.cursor;
  if (!c || !cursorSteps.length) return false;
  idx = Math.max(0, Math.min(cursorSteps.length - 1, idx));
  if (idx === cursorIdx) return false;
  if (idx < cursorIdx) { c.reset(); cursorIdx = 0; }
  while (cursorIdx < idx) { c.next(); cursorIdx++; }
  return true;
}
const headerBottom = () => document.querySelector("header").getBoundingClientRect().bottom;
function inView(el){ const r = el.getBoundingClientRect(); return r.bottom > headerBottom() + 40 && r.top < innerHeight - 40; }
// 練習卡片看得到時以卡片為主,不捲頁面;使用者捲到樂譜那裡(卡片看不到)才讓頁面跟著游標

addEventListener("resize", () => {

/* ══ 播放:每小節一個和弦,往前排程 0.6 秒 ══════════════════════
   鋼琴:左手的分解音在小節內延音(像踩踏板),換和弦時放開;爵士/Boogie 不踩踏板(爵士右手半踏板)
   吉他:同一條弦再撥時才止住前一個音,換和弦時放開 */
let playing = false, schedTimer = 0, rafId = 0, nextBarTime = 0, nextBar = 0, playEnd = Infinity, timeline = [], playToken = 0, visEvents = [];
function seeded(a, b){ let t = (a * 374761393 + b * 668265263) | 0; t = Math.imul(t ^ t >>> 13, 1274126177); return ((t ^ t >>> 16) >>> 0) / 4294967296; }
function barSecOf(tempo){ return 60 / tempo * 4; }
function nextBarIndex(bi, loop){ return bi + 1 < curGen.bars.length ? bi + 1 : (loop ? 0 : null); }
function scheduleBar(gen, bi, t, tempo, loop, pass, vis){
  const bar = gen.bars[bi], s16 = 60 / tempo / 4, barSec = 16 * s16, last = bi === gen.bars.length - 1;
  const nb = nextBarIndex(bi, loop);
  // 搖擺(藍調、爵士):反拍的八分音符晚 1/3 拍(前長後短 2:1),譜上照慣例寫平均八分
  const sw = gen.guide.swing ? a => (a % 4 === 2 ? a + 2 / 3 : a) : a => a;
  const show = (n, when) => { if (vis) visEvents.push({ bi, m: n.midi, s: n.str, t0: when, t1: when + Math.max(0.12, n.dur * s16 * 0.92) }); };
  if (gen.guide.inst === "piano") {
    const pedal = gen.guide.pedal;
    const barEnd = t + barSec + (last && !loop ? 1.6 : 0.03);
    bar.notes.forEach((n, k) => {
      const r = seeded(bi * 97 + pass * 7919, k);
      const when = t + sw(n.at) * s16 + (n.at ? 0.004 : 0) + (n.hand === "R" ? r * 0.008 : r * 0.004);
      const keyUp = t + sw(n.at + n.dur) * s16 - 0.012;
      const vel = Math.max(20, Math.min(110, n.vel + (r - 0.5) * 6));
      let damper = keyUp, ped = false;
      if (pedal || last) { damper = barEnd; ped = true; }
      else if (n.hand === "R") damper = barEnd;   // 不踩踏板的型態:右手半踏板(放鍵後還有一點餘音),左手乾淨
      playPianoNote(n.midi, when, keyUp, damper, vel, ped);
      show({ ...n, str: null }, when);
    });
  } else {
    const nextBarObj = nb != null ? gen.bars[nb] : null, sameNext = nextBarObj && nextBarObj.chord.name === bar.chord.name;
    bar.notes.forEach((n, k) => {
      const r = seeded(bi * 131 + pass * 7919, k);
      const when = t + sw(n.at) * s16 + n.strum + r * 0.006;
      let rel, chordStop = false;
      const again = bar.notes.find(x => x.str === n.str && x.at > n.at);
      if (again) rel = t + sw(again.at) * s16;
      else if (last) rel = t + barSec + (loop ? 0.02 : 1.6);
      else if (sameNext) { const a2 = nextBarObj.notes.find(x => x.str === n.str); rel = t + barSec + (a2 ? sw(a2.at) * s16 : barSec); }
      else { rel = t + barSec + 0.02; chordStop = true; }   // 換和弦:左手放開
      const vel = Math.max(30, Math.min(120, n.vel + (r - 0.5) * 8));

}
function schedTick(){
  if (!playing) return;
  const now = audioCtx.currentTime;
  while (nextBar != null && nextBarTime < now + 0.6) {
    const pass = timeline.filter(x => x.bi === nextBar).length;
    const barSec = scheduleBar(curGen, nextBar, nextBarTime, state.tempo, state.loop, pass, true);
    timeline.push({ bi: nextBar, t: nextBarTime, sec: barSec });
    if (timeline.length > 64) timeline.shift();
    nextBarTime += barSec;
    const nb = nextBarIndex(nextBar, state.loop);
    if (nb == null) { playEnd = nextBarTime; nextBar = null; }
    else nextBar = nb;
  }
  if (nextBar == null && now > playEnd + 0.4) stop();
}
function visualTick(){
  if (!playing) return;
  rafId = requestAnimationFrame(visualTick);
  const now = audioCtx.currentTime - (audioCtx.outputLatency || 0);
  let cur = null;
  for (const x of timeline) if (x.t <= now) cur = x;
  if (!cur || !curGen.bars[cur.bi]) return;
  const step = curGen.bars[cur.bi].step;
  setActiveStep(step, true);
  const pos = Math.min(0.999, (now - cur.t) / cur.sec);
  const n = gridSize();
  markGridCell(Math.floor(pos * n));
  visEvents = visEvents.filter(e => e.t1 > now - 1);
  showHits(step, visEvents.filter(e => e.bi === cur.bi && e.t0 <= now && now < e.t1));
  if (state.showScore && osmd && cursorSteps.length) {
    const wholes = cur.bi + pos;
    let k = 0;
    while (k + 1 < cursorSteps.length && cursorSteps[k + 1] <= wholes + 1e-6) k++;
    if (moveCursorTo(k)) keepCursorVisible();
  }
}
function setStatus(s){ $("status").textContent = s || ""; }
function setPlayUI(on){
  $("playLabel").textContent = T(on ? "stop" : "play");
  const icon = on ? '<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/>' : '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>';
  $("playIcon").innerHTML = icon;
}
async function loadSamplesFor(gen, onProgress){
  if (gen.guide.inst === "guitar") await loadGuitarFor(gen, onProgress);
  else await loadPianoFor(gen, Math.min(16, barSecOf(Math.min(state.tempo, 200)) + 2.5), onProgress);
  await masterReady;
}
async function play(){
  if (playing) { stop(); return; }
  ensureAudio();
  try { await audioCtx.resume(); } catch (e) {}
  playing = true; setPlayUI(true); auditionToken++;
  ensureStageVisible();
  const token = ++playToken, gen = curGen;
  const isG = gen.guide.inst === "guitar";
  setStatus(T(isG ? "loadingGuitar" : "loadingPiano", { pct: 0 }));
  try {
    await loadSamplesFor(gen, p => { if (token === playToken) setStatus(T(isG ? "loadingGuitar" : "loadingPiano", { pct: Math.round(p * 100) })); });
  } catch (e) {
    console.error(e);
    if (token === playToken) { playing = false; setPlayUI(false); setStatus(T("loadFail")); }
    return;
  }
  if (!playing || token !== playToken || gen !== curGen) return;
  setStatus(T("ready"));
  masterOut.gain.cancelScheduledValues(0); masterOut.gain.value = 1;
  pianoLastByKey = {}; gtrRR = {};
  $("stageRow").classList.add("playing");
  const beat = 60 / state.tempo;
  let t = audioCtx.currentTime + 0.12;
  if (state.countIn) { for (let i = 0; i < 4; i++) playClick(t + i * beat, i === 0); t += 4 * beat; }
  nextBarTime = t; nextBar = 0; playEnd = Infinity; timeline = []; visEvents = [];
  if (osmd && osmd.cursor) { osmd.cursor.reset(); cursorIdx = 0; osmd.cursor.show(); }
  schedTick();
  schedTimer = setInterval(schedTick, 40);
  rafId = requestAnimationFrame(visualTick);
}
function stop(){
  playToken++;
  const was = playing;
  playing = false;
  clearInterval(schedTimer); cancelAnimationFrame(rafId);
  setPlayUI(false);
  if (audioCtx && masterOut && was) {
    const now = audioCtx.currentTime, list = scheduled;
    scheduled = [];
    masterOut.gain.cancelScheduledValues(now);
    masterOut.gain.setValueAtTime(masterOut.gain.value, now);
    masterOut.gain.setTargetAtTime(0, now, 0.03);
    for (const n of list) { try { n.stop(now + 0.2); } catch (e) {} }
    setTimeout(() => { if (!playing && audioCtx) { masterOut.gain.cancelScheduledValues(0); masterOut.gain.value = 1; } }, 260);
  }
  visEvents = []; timeline = []; clearHits(); markGridCell(-1); hlStep = -1;
  $("stageRow").classList.remove("playing");
  if (curGen) setActiveStep(selStep, true);
  if (osmd && osmd.cursor) { try { osmd.cursor.reset(); cursorIdx = 0; } catch (e) {} }
  if (scoreDirty) { scoreDirty = false; renderScore(); }
}

/* 離線渲染(測試用:量響度/真峰值):跟播放同一條音訊路徑,用 OfflineAudioContext 算出 seconds 秒 */
async function renderOffline(seconds, sr = 48000){
  if (playing) stop();
  const live = audioCtx;
  audioCtx = new OfflineAudioContext(2, Math.ceil(sr * seconds), sr);
  buildMaster();
  try {
    await masterReady;
    await loadSamplesFor(curGen);
    pianoLastByKey = {}; gtrRR = {};
    let t = 0.05, bi = 0, pass = 0;
    while (t < seconds) {
      t += scheduleBar(curGen, bi, t, state.tempo, true, pass, false);
      bi = nextBarIndex(bi, true); if (bi === 0) pass++;
    }
    const buf = await audioCtx.startRendering();
    return buf;
  } finally { scheduled = []; audioCtx = live; if (live) buildMaster(); }
}

function applyLanguage(lang){
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
  document.title = T("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-attr]").forEach(el => {
    for (const pair of el.dataset.i18nAttr.split(",")) { const [a, k] = pair.split(":"); el.setAttribute(a, T(k)); }
  });
  $("langToggle").setAttribute("aria-pressed", String(lang === "en"));
  setPlayUI(playing);
  renderCredits();
  renderControls();
  applyScoreToggle();
  if (curGen) regenerate({ keepPlaying: true, keepSel: true });
}
$("langToggle").onclick = () => applyLanguage(LANG === "zh" ? "en" : "zh");

}

});
$("countBtn").addEventListener("click", () => { state.countIn = !state.countIn; $("countBtn").setAttribute("aria-pressed", String(state.countIn)); savePrefs(); });
