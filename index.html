<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0A07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HarmonyHands">
<meta name="application-name" content="HarmonyHands">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230C0A07'/%3E%3Cpath d='M9 18V6l10-2v12' fill='none' stroke='%23F2B94B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='6.5' cy='18' r='2.5' fill='%23F2B94B'/%3E%3Ccircle cx='16.5' cy='16' r='2.5' fill='%233FBFAE'/%3E%3C/svg%3E">
<title id="pageTitle">HarmonyHands — 和弦伴奏指法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══ 設計代幣:照抄 HarmonyMap(與 ScrollScore 同一套語意變數),同一系列的工具放在一起看是同一個產品 ══ */
:root{
  --bg:#0C0A07;
  --panel:#161209;
  --panel-2:#201A0F;
  --gold:#F2B94B;
  --gold-bright:#EFD48A;
  --brand-gold:#C9A24B;   /* 品牌名照 ScrollScore 原本的顏色(品牌名的 CSS 要跟 ScrollScore / HarmonyMap 逐項相同) */
  --note-gold:#F2B94B;
  --note-teal:#3FBFAE;
  --gold-fill:#F2B94B;
  --teal-fill:#3FBFAE;
  --on-fill:#16110A;
  --teal:#3FBFAE;
  --teal-bright:#8FFFF0;
  --ivory:#F4ECDA;
  --muted:#8A7D5F;
  --muted-bright:#B6A576;
  --line:#2A2415;
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --shadow-md:0 10px 26px rgba(0,0,0,.5);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-pill:999px;
  --fs-2xs:11px;
  --fs-xs:12px;
  --fs-sm:13px;
  --fs-md:14px;
  --fs-lg:16px;
  --fs-xl:19px;
  --fs-2xl:26px;
  --surface-glass:rgba(32,26,15,.88);
  --surface-inset:rgba(22,18,9,.55);
  --card-tint:rgba(255,255,255,.035);
  --stage-glow:#171208;
  --paper:#FFFDF6;        /* 樂譜紙張:深色/淺色主題都一樣 */
  color-scheme:dark;
}
/* ══ 淺色主題:同一組語意變數換一套值 ══ */
body.light{
  --bg:#FBF7EE;
  --panel:#F4EEE0;
  --panel-2:#EDE6D4;
  --gold:#856418;
  --gold-bright:#6B5115;
  --brand-gold:#856418;
  --teal:#0F5F56;
  --teal-bright:#0B463F;
  --ivory:#241E12;
  --muted:#6F6450;
  --muted-bright:#544B3B;
  --line:#D8CDB2;
  --shadow-sm:0 4px 14px rgba(90,72,30,.10);
  --shadow-md:0 10px 26px rgba(90,72,30,.14);
  --shadow-lg:0 18px 44px rgba(90,72,30,.18);
  --surface-glass:rgba(252,249,241,.92);
  --surface-inset:rgba(255,255,255,.7);
  --card-tint:rgba(133,100,24,.05);
  --stage-glow:#FFFDF6;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,[role="button"],.seg,.chips,.dg-wrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{height:100%}
body{
  min-height:100%;
  background:var(--bg);color:var(--ivory);
  font-family:"Noto Sans TC",sans-serif;
  display:flex;flex-direction:column;
}
/* ── 頂欄(照抄 HarmonyMap)───────────────────────── */
header{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:8px 14px;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.header-left,.header-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
/* 品牌名:這一組數值與 ScrollScore / HarmonyMap 完全相同 */
header h1{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(12px, 3.7vw, var(--fs-lg));
  letter-spacing:clamp(.02em, .55vw, .12em);
  font-weight:700;color:var(--brand-gold);white-space:nowrap;
  flex:none;
}
header h1 span{color:var(--ivory);font-weight:600}
.tagline{color:var(--muted);font-size:var(--fs-xs);letter-spacing:.04em;white-space:nowrap;line-height:17px}
@media (max-width:600px){ .tagline{display:none} }
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:inherit;font-size:var(--fs-md);font-weight:500;
  padding:8px 16px;height:38px;border-radius:var(--radius-pill);cursor:pointer;
  transition:background .2s,color .2s;white-space:nowrap;
}
.btn svg{flex:none}
.btn:active{background:var(--gold-fill);color:var(--on-fill)}
.btn.primary{background:var(--gold-fill);color:var(--on-fill);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--muted-bright)}
.btn.small{height:32px;padding:0 12px;font-size:var(--fs-sm)}
.btn[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
#themeToggle[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
#langToggle{aspect-ratio:1;padding:0}
#langToggle[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill)}
@media (max-width:600px){
  header{padding:8px clamp(6px, 2.2vw, 10px);gap:clamp(4px, 1.4vw, 6px);flex-wrap:nowrap}
  .header-left,.header-right{gap:clamp(4px, 1.4vw, 6px)}
  .btn{padding:0 10px;height:34px;font-size:var(--fs-sm)}
}
@media (max-width:380px){ .btn{padding:0 8px;height:32px} }
@media (max-width:340px){ .btn{padding:0 5px} }
@media (max-height:420px){
  header{padding:5px 10px;gap:4px 8px}
  header h1{font-size:var(--fs-sm)}
  .btn{padding:0 10px;height:28px;font-size:var(--fs-xs)}
}

/* ── 版面:設定 → 樂譜 → 指法說明,由上到下 ── */
main{
  flex:1;display:flex;flex-direction:column;gap:14px;
  padding:14px;max-width:1400px;width:100%;margin:0 auto;min-width:0;
}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-md);padding:14px 16px;min-width:0;
  background-image:linear-gradient(180deg, var(--card-tint), transparent 90px);
}
.card-title{
  font-size:var(--fs-2xs);letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.card-title b{font-family:"Noto Serif TC",serif;font-size:var(--fs-lg);letter-spacing:.06em;color:var(--gold);text-transform:none;font-weight:700}
.card-title .sub{letter-spacing:.04em;text-transform:none;font-size:var(--fs-xs);color:var(--muted-bright)}

/* 樂器切換(兩段式) */
.seg{display:flex;gap:0;border:1px solid var(--gold);border-radius:var(--radius-pill);overflow:hidden;margin-bottom:12px}
.seg button{flex:1 1 0;min-width:0;height:40px;border:0;background:transparent;color:var(--gold);font-family:inherit;
  font-size:var(--fs-md);font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.seg button + button{border-left:1px solid var(--gold)}
.seg button[aria-pressed="true"]{background:var(--gold-fill);color:var(--on-fill);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:span 2}
.field label{font-size:var(--fs-xs);color:var(--muted-bright);letter-spacing:.04em}
.field select,.field input{
  width:100%;min-width:0;height:38px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface-inset);color:var(--ivory);font-family:inherit;font-size:var(--fs-md);padding:0 10px;
}
.field select:focus,.field input:focus{outline:none;border-color:var(--gold)}
.tempo-row{display:flex;gap:6px;align-items:center}
.tempo-row input{flex:1 1 auto;text-align:center}
.tempo-row .btn{flex:none;width:38px;padding:0;height:38px}
/* 窄螢幕兩欄:風格、調並排,進行與型態各占一整行,速度與反覆並排 */
@media (max-width:900px){
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  #fStyle{order:1} #fKey{order:2} #fProg{order:3} #fPattern{order:4} #fTempo{order:5} #fLoops{order:6}
}
@media (max-width:600px){ .tempo-row .btn{width:34px;height:38px} }

/* 實際和弦預覽 */
.preview{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--radius-pill);
  background:var(--surface-inset);font-size:var(--fs-md);font-weight:500;color:var(--ivory);transition:background .12s,border-color .12s,box-shadow .12s}
.chip small{font-size:var(--fs-2xs);color:var(--muted)}
.chip[role="button"]{cursor:pointer}
.chip.on{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill);box-shadow:0 0 16px -4px rgba(242,185,75,.75)}
.chip.on small{color:var(--on-fill)}
.capo-hint{font-size:var(--fs-sm);color:var(--teal);line-height:1.5}
.capo-hint:empty{display:none}

/* 播放列 */
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.transport .btn.primary{min-width:112px}
.status{font-size:var(--fs-xs);color:var(--muted);margin-left:auto;min-width:0}
@media (max-width:600px){ .status{flex-basis:100%;margin-left:0} }

/* 樂譜:米色紙張 */
.paper{background:var(--paper);border-radius:var(--radius-sm);padding:8px 4px;min-height:160px;overflow:hidden;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
#osmd{width:100%;color:#16130D}
.paper-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6f6450;font-size:var(--fs-sm);padding:16px;text-align:center}
.paper-msg:empty{display:none}

/* 指法說明 */
.legend{font-size:var(--fs-sm);line-height:1.75;color:var(--muted-bright);margin-bottom:12px}
.legend b{color:var(--ivory);font-weight:700}
.legend .t{display:inline-block;min-width:1.6em;text-align:center;padding:0 4px;border-radius:6px;background:var(--surface-inset);
  border:1px solid var(--line);color:var(--gold);font-weight:700;margin:0 2px}

/* ── 練習:和弦卡片(照 HarmonyMap 練習模式的卡片)──
   一步一張,橫向排;張數多時這一排自己左右捲(頁面不會橫向捲動)。手機直式一次一張、滑動切換 */
.stage-row{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:10px 10px 16px;margin:-6px -10px 0;   /* 內距留給外框光暈,不會被捲動容器切掉 */
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior-x:contain}
.scard{flex:0 0 clamp(220px, calc((100% - 30px) / 4), 340px);scroll-snap-align:center;min-width:0;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-inset);padding:12px 12px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .15s,box-shadow .2s}
.scard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px 2px rgba(242,185,75,.35)}
.scard-name{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(28px,3.2vw,40px);line-height:1.1;color:var(--muted-bright);text-align:center;white-space:nowrap}
.scard.on .scard-name{color:var(--gold-bright)}
.scard-sub{font-size:var(--fs-xs);color:var(--muted);text-align:center;min-height:1.2em}
.scard svg{display:block;width:100%;height:auto}
.scard svg.gb{max-width:190px}
.scard-row{display:flex;gap:6px;align-items:baseline;font-size:var(--fs-sm);width:100%;min-width:0}
.scard-row span{flex:none;font-size:var(--fs-2xs);color:var(--muted);width:2.6em}
.scard-row i{font-style:normal;color:var(--ivory);min-width:0;overflow-wrap:anywhere}
.scard-row em{font-style:normal;font-size:var(--fs-2xs);color:var(--teal);margin-left:auto;flex:none;padding-left:4px}
/* 鋼琴小鍵盤:顏色照 HarmonyMap(根音金、其他和弦音青);正在彈的鍵再亮一層 */
svg.kb .w{fill:#FFFDF6;stroke:#8A7D5F;stroke-width:.6}
svg.kb .bk{fill:#1C1A16}
svg.kb .w.r{fill:#F2B94B} svg.kb .w.t{fill:#3FBFAE}
svg.kb .bk.r{fill:#BC8A1C} svg.kb .bk.t{fill:#2FA897}
/* 播放中:目前這張卡上「沒在響」的和弦音退成淡色,正在響的維持原本的飽和色 + 光暈,一眼看得出現在按哪幾個鍵 */
#stageRow.playing .scard.on svg.kb .w.r:not(.hit){fill:#F3E2BE} #stageRow.playing .scard.on svg.kb .w.t:not(.hit){fill:#CDEBE6}
#stageRow.playing .scard.on svg.kb .bk.r:not(.hit){fill:#8A7448} #stageRow.playing .scard.on svg.kb .bk.t:not(.hit){fill:#3F756E}
svg.kb .r.hit{filter:drop-shadow(0 0 5px rgba(242,185,75,.95))}
svg.kb .t.hit{filter:drop-shadow(0 0 5px rgba(63,191,174,.95))}
svg.kb .hb{fill:none;stroke:var(--muted);stroke-width:1.2}
svg.kb .hl{fill:var(--muted-bright);font:600 12px "Noto Sans TC",sans-serif;text-anchor:middle}
/* 吉他和弦圖:照 HarmonyMap(點的顏色依音:根音金、其他青;數字 = 左手手指),下方是右手撥這條弦的手指 */
svg.gb .ln{stroke:var(--muted-bright);stroke-width:1.6}
svg.gb .str{stroke:var(--muted-bright);transition:stroke .08s}
svg.gb .nut{stroke:var(--muted-bright);stroke-linecap:square}
svg.gb .bg{fill:var(--surface-inset)}
svg.gb .brr{fill:var(--muted-bright);opacity:.55}
svg.gb .fn{fill:#16130D;font:700 10px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .mx{fill:var(--muted);font:600 13px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .fr{fill:var(--muted);font:500 10px "Noto Sans TC",sans-serif}
svg.gb .tok{fill:var(--muted-bright);font:700 13px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .tokl{fill:var(--muted-bright);font:600 11px "Noto Sans TC",sans-serif;text-anchor:middle}
svg.gb .str.hit{stroke:var(--gold);stroke-width:3.2}
svg.gb .tok.hit{fill:var(--gold)}
svg.gb .fd.hit,svg.gb .od.hit{filter:drop-shadow(0 0 4px rgba(255,236,190,.95))}
/* 一小節的節奏格:播放時亮起來的一欄是現在 */
.grid{display:grid;grid-template-columns:2.8em repeat(var(--n,8),minmax(0,1fr));gap:3px;margin-top:6px}
.grid .h{font-size:var(--fs-2xs);color:var(--muted);text-align:center;line-height:16px}
.grid .h.beat{color:var(--muted-bright);font-weight:700}
.grid .lab{font-size:var(--fs-2xs);color:var(--muted);align-self:center;white-space:nowrap}
.grid .c{height:42px;border-radius:6px;background:var(--surface-inset);border:1px solid var(--line);min-width:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-lg);font-weight:700;color:var(--ivory);line-height:1.05}
.grid .c small{font-size:10px;font-weight:500;color:var(--muted)}
.grid .c.hold{background:rgba(242,185,75,.08);border-color:transparent}
.grid .c.on{border-color:var(--muted-bright)}
.grid .c.now{background:rgba(242,185,75,.2);border-color:var(--gold)}
.grid .c.now.on{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-fill)}
.grid .c.now.on small{color:var(--on-fill)}
.stage-play{margin-left:auto;width:38px;padding:0}
#scoreToggle{margin-left:auto}
#scoreToggle svg{transition:transform .2s}
#scoreToggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.paper[hidden]{display:none}
@media (max-width:600px){
  .scard{flex-basis:100%}
  .scard svg.gb{max-width:210px}
  .grid{grid-template-columns:2.4em repeat(var(--n,8),minmax(0,1fr));gap:2px}
  .grid .c{height:34px;font-size:var(--fs-sm);border-radius:5px}
  .grid .c small{font-size:9px}
  .stage-play{width:34px}
}
/* 手機橫向:卡片與節奏格壓扁,一個畫面放得下卡片 + 節奏格 */
@media (max-height:420px) and (min-width:601px){
  .scard{flex-basis:clamp(170px, calc((100% - 30px) / 4), 300px);padding:8px 10px 8px;gap:3px}
  .scard-name{font-size:24px}
  .scard-row{font-size:var(--fs-xs)}
  .grid .c{height:26px;font-size:var(--fs-xs)}
  .grid .h{line-height:12px}
  #stageCard .card-title{margin-bottom:4px}
  .scard svg.gb{max-width:104px}
  .scard-sub.foot{display:none}   /* 「T 彈第幾弦」圖下已經標了,橫向省掉 */
}
footer{max-width:1400px;width:100%;margin:0 auto;padding:6px 16px 28px;font-size:var(--fs-xs);line-height:1.8;color:var(--muted)}
footer a{color:var(--muted-bright)}
footer b{color:var(--muted-bright);font-weight:500}

/* 背景的兩團淡光(照 HarmonyMap) */
body{background:
  radial-gradient(ellipse 70% 45% at 0% 100%, rgba(242,185,75,.075), transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%, rgba(63,191,174,.06), transparent 70%),
  var(--bg);background-attachment:fixed}
body.light{background:
  radial-gradient(ellipse 70% 45% at 0% 100%, rgba(242,185,75,.16), transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%, rgba(63,191,174,.12), transparent 70%),
  var(--bg);background-attachment:fixed}
.btn.primary{box-shadow:0 6px 22px -8px rgba(242,185,75,.8)}
.btn,.seg button{transition-property:background,color,border-color,box-shadow,transform;transition-duration:.15s,.15s,.15s,.2s,.09s}
.btn:active,.seg button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
@media (max-width:600px){
  main{padding:10px;gap:10px}
  .card{padding:12px}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Harmony<span>Hands</span></h1>
    <span class="tagline" data-i18n="tagline">和弦伴奏指法</span>
  </div>
  <div class="header-right">
    <button class="btn" id="themeToggle" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" aria-label="淺色模式" title="切換淺色/深色主題">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" data-i18n-attr="aria-label:langToggleLabel,title:langToggleTitle" data-i18n="langToggleText">EN</button>
  </div>
</header>

<main>
  <!-- 1. 設定 -->
  <section class="card" id="setupCard">
    <div class="card-title"><b data-i18n="setupTitle">伴奏設定</b><span class="sub" data-i18n="setupSub">選風格與和弦進行,產生伴奏樂譜</span></div>

const ACC_IV_LETTER = { 0: 0, 2: 1, 3: 2, 4: 2, 7: 4, 9: 5, 10: 6, 11: 6 };

function accParseRoman(tok){
  const m = /^([b#]?)(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(maj7|7)?(?:\/(b?\d))?$/.exec(tok);
  if (!m) throw new Error("bad roman " + tok);
  const minor = m[2] === m[2].toLowerCase();
  let ivs, kind, kt;
  if (!minor) {
    if (m[3] === "7") { ivs = [0,4,7,10]; kind = "dominant"; kt = "7"; }
    else if (m[3] === "maj7") { ivs = [0,4,7,11]; kind = "major-seventh"; kt = "maj7"; }
    else { ivs = [0,4,7]; kind = "major"; kt = ""; }
  } else if (m[3] === "7") { ivs = [0,3,7,10]; kind = "minor-seventh"; kt = "m7"; }
  else { ivs = [0,3,7]; kind = "minor"; kt = "m"; }
  return { deg: ACC_ROMAN.indexOf(m[2].toUpperCase()), acc: m[1] === "b" ? -1 : m[1] === "#" ? 1 : 0, ivs, kind, kt,
           bassIv: m[4] ? ({ "3": ivs[1], "5": 7, "b7": 10, "7": 11 })[m[4]] : 0, roman: tok };

function accNameParts(name){

  return { li, pc: (ACC_MAJ[li] + alter + 12) % 12 };

function accAlterOf(li, pc){ let d = ((pc - ACC_MAJ[li]) % 12 + 12) % 12; if (d > 6) d -= 12; return d; }

  const a = accAlterOf(li, pc);

}

  const alter = accAlterOf(p.li, ((p.midi % 12) + 12) % 12);
  return { step: ACC_LETTERS[p.li], alter, octave: Math.round((p.midi - alter - ACC_MAJ[p.li]) / 12) - 1 };
}

function gtrBookFingers(frets){
  if (!gtrBookFingers.map) {
    gtrBookFingers.map = new Map();
    for (const e of FINGER_BOOK.split(" ")) { const i = e.indexOf(":"); gtrBookFingers.map.set(e.slice(0, i), e.slice(i + 1)); }
  }
  const c36 = f => f < 0 ? "x" : f.toString(36), on = frets.filter(f => f > 0);
  const key = frets.includes(0) ? "o" + frets.map(c36).join("") : on.length ? "r" + frets.map(f => f < 0 ? "x" : c36(f - Math.min(...on))).join("") : "";
  const hit = gtrBookFingers.map.get(key);
  return hit ? [...hit].map(ch => ch === "." ? 0 : ch === "T" ? "T" : +ch) : null;
}
function accGtrShape(pc, kt, bassPc){
  let shape;
  const open = ACC_GTR_OPEN[pc + ":" + kt];
  if (open) shape = { frets: [...open[0]].map(c => c === "x" ? -1 : +c), fingers: [...open[1]].map(Number), open: true };
  else {
    const rE = ((pc - 4) % 12 + 12) % 12 || 12, rA = ((pc - 9) % 12 + 12) % 12 || 12;
    const [type, r] = rA <= rE ? ["A", rA] : ["E", rE];
    const [rel, fing] = ACC_GTR_BARRE[type][kt];
    shape = { frets: rel.map(f => f < 0 ? -1 : f + r), fingers: fing.slice(), open: false, barre: r };
  }
  shape = accGtrSlash(shape, bassPc);
  const book = gtrBookFingers(shape.frets);
  if (book) shape = { ...shape, fingers: book, fromBook: true };
  return shape;
}
// 轉位和弦(C/E、G/B、C/G、Am/G…):把指定低音放到第 6/5/4 弦上手按得到的位置,以下的弦不彈
function accGtrSlash(shape, bassPc){
  const fr = shape.frets, low = fr.findIndex(f => f >= 0);
  if ((ACC_GTR_OPEN_MIDI[low] + fr[low]) % 12 === bassPc) return shape;
  const pressed = fr.filter(f => f > 0), minF = pressed.length ? Math.min(...pressed) : 1, maxF = pressed.length ? Math.max(...pressed) : 1;
  for (let s = 0; s <= 2; s++) {
    for (let f = 0; f <= Math.max(maxF, 4); f++) {
      if ((ACC_GTR_OPEN_MIDI[s] + f) % 12 !== bassPc) continue;
      if (f > 0 && (Math.abs(f - minF) > 3 || Math.abs(f - maxF) > 3)) continue;
      const frets = fr.slice(), fingers = shape.fingers.slice();
      for (let i = 0; i < s; i++) { frets[i] = -1; fingers[i] = 0; }
      if (!(frets[s] === f && fingers[s])) {
        const used = new Set(fingers.filter((x, i) => i !== s && x > 0));
        fingers[s] = f === 0 ? 0 : ([4, 3, 2, 1].find(x => !used.has(x)) || 1);
      }
      frets[s] = f;
      return { ...shape, frets, fingers };
    }
  }
  return shape;
}

function accGtrPlan(chords){
  let best = null;
  for (let c = 0; c <= 7; c++) {
    let score = c * 0.6;
    const shapes = chords.map(ch => {
      const s = accGtrShape((ch.rootPc - c + 12) % 12, ch.kt, (ch.bass.pc - c + 12) % 12);
      if (!s.open) score += 3;
      return s;
    });
    if (!best || score < best.score) best = { capo: c, shapes, score };
  }
  return best;
}

function accShapeName(ch, capo){
  const r = (ch.rootPc - capo + 12) % 12, b = (ch.bass.pc - capo + 12) % 12;

function accGtrStringFor(tok, frets){
  const playable = i => frets[i] >= 0;
  const bass = frets.findIndex(f => f >= 0);
  if (tok === "T") return bass;
  if (tok === "T'") { const alt = bass <= 1 ? 2 : (playable(1) ? 1 : bass); return playable(alt) ? alt : bass; }
  let s = { "1": 3, "2": 4, "3": 5 }[tok];

function accLetterFor(midi, ch, key){
  const pc = midi % 12;
  const t = ch.tones.find(x => x.pc === pc) || (ch.bass.pc === pc ? ch.bass : null);
  if (t) return t.li;
  for (let li = 0; li < 7; li++) if (ACC_MAJ[li] === pc) return li;
  return key.fifths < 0 ? (ACC_MAJ.findIndex(x => x === pc + 1) + 7) % 7 : ACC_MAJ.findIndex(x => x === pc - 1);

function accNotesXml(evs, staff, voice, tab){

  const out = [];

  const rest = d => {
    while (d > 0) {
      const piece = [16, 8, 4, 2, 1].find(x => x <= d && t % x === 0) || 1;
      const [type] = ACC_DUR_TYPES[piece];

      t += piece; d -= piece;

}

   回傳 { xml, title, guide, bars:[{ chord, notes:[{at, dur, midi, vel, hand|str, strum}] }], passLen }
   bars 是播放用的音符表(跟樂譜同一份資料產生,不用再從 MusicXML 解析) */
function accGenerate(opts){
  const style = ACC_STYLES.find(s => s.id === opts.style) || ACC_STYLES[0], prog = style.progs[opts.prog] || style.progs[0];
  const key = accKeyFor(style, opts.tonic);
  const romans = prog.ch.split(" ");
  const loops = Math.max(1, +opts.loops || 1);
  const endRoman = style.id === "blues" ? "I7" : style.minor ? "i" : (romans.every(r => /7/.test(r)) ? "Imaj7" : "I");   // 最後補一小節主和弦
  const passChords = romans.map(r => accRealize(accParseRoman(r), key));
  const endChord = accRealize(accParseRoman(endRoman), key);
  const isGtr = opts.inst === "guitar";
  const keyName = accPcName(key.li, key.pc) + (style.minor ? "m" : "");
  const passBars = [];          // 一遍進行的每小節(反覆時每遍都一樣,說明卡片才對得起來)
  let endBar = null, plan = null;
  const guide = { inst: opts.inst, keyName, pattern: opts.pattern, capo: 0, steps: [], shapeNames: [] };

  if (!isGtr) {
    const pat = ACC_PIANO_PATTERNS[opts.pattern] ? opts.pattern : style.piano, jazz = pat === "jazz";
    guide.pattern = pat;
    const voiceOf = (ch, prev) => {
      let rhTones = ch.tones;
      if (jazz) {
        const sev = ch.tones[3] || ch.tone(ch.kind === "major" ? 11 : 10);
        rhTones = [ch.tones[1], ch.tones[2], sev, ch.tone(2)];
      }
      return accVoiceRH(rhTones, prev, pat === "boogie" ? 62 : 60, jazz ? 79 : 78, jazz ? 66 : 67, jazz ? [3, 4, 10, 11] : null);
    };
    // 先空跑一遍讓右手位置穩定(第二遍的第一個和弦是從最後一個和弦接過來的),之後每一遍都用同一組轉位
    let prev = null;
    for (const ch of passChords) prev = voiceOf(ch, prev);
    const rhs = passChords.map(ch => (prev = voiceOf(ch, prev)));
    const rhEnd = voiceOf(endChord, rhs[rhs.length - 1]);
    const build = (ch, rh, last) => {
      const b = { ...ch.bass, midi: accPlace(ch.bass.pc, pat === "alberti" ? 43 : 40) };
      const oct = { ...b, midi: b.midi + 12 };
      const other = ch.tones.filter(t => t.pc !== b.pc);
      const fifthT = ch.bassIv === 0 ? ch.tones[2] : (ch.bass.pc === ch.tones[2].pc ? ch.tones[0] : ch.tones[2]);
      const f = { ...fifthT, midi: accAbove(fifthT.pc, b.midi) };
      const lab = accInvLabel(rh, jazz);
      let rhEv, lhEv;
      if (last || pat === "block") {
        rhEv = [{ at: 0, dur: 16, pitches: rh, lyric: lab }];
        lhEv = [{ at: 0, dur: 16, pitches: [b, oct] }];
      } else if (pat === "broken") {
        rhEv = [{ at: 0, dur: 8, pitches: rh, lyric: lab }, { at: 8, dur: 8, pitches: rh }];
        lhEv = [b, f, oct, f, b, f, oct, f].map((p, i) => ({ at: i * 2, dur: 2, pitches: [p] }));
      } else if (pat === "pop") {
        rhEv = [{ at: 0, dur: 6, pitches: rh, lyric: lab }, { at: 6, dur: 6, pitches: rh }, { at: 12, dur: 4, pitches: rh }];
        lhEv = [{ at: 0, dur: 6, pitches: [b, oct] }, { at: 6, dur: 6, pitches: [b, oct] }, { at: 12, dur: 4, pitches: [b, oct] }];
      } else if (pat === "alberti") {
        const x1 = { ...other[0], midi: accAbove(other[0].pc, b.midi) };
        const x2c = other.find(t => t.pc !== x1.pc) || other[0];
        const x2 = { ...x2c, midi: accAbove(x2c.pc, x1.midi) };
        const [lo2, hi2] = [x1, x2].sort((a, c) => a.midi - c.midi);
        rhEv = [{ at: 0, dur: 8, pitches: rh, lyric: lab }, { at: 8, dur: 8, pitches: rh }];
        lhEv = [b, hi2, lo2, hi2, b, hi2, lo2, hi2].map((p, i) => ({ at: i * 2, dur: 2, pitches: [p] }));
      } else if (pat === "jazz") {
        const shellT = ch.tones[3] || ch.tones[1];
        const shell = { ...shellT, midi: accAbove(shellT.pc, b.midi) };
        rhEv = [{ at: 0, dur: 6, pitches: rh, lyric: lab }, { at: 6, dur: 2, pitches: rh }];
        lhEv = [{ at: 0, dur: 16, pitches: [b, shell] }];
      } else { // boogie
        const r0 = ch.bassIv ? { ...ch.tones[0], midi: accPlace(ch.tones[0].pc, 40) } : b;
        const steps = [0, 4, 7, 9, 10, 9, 7, 4];
        lhEv = steps.map((iv, i) => ({ at: i * 2, dur: 2, pitches: [{ ...ch.tone(iv), midi: r0.midi + iv }] }));
        rhEv = [{ at: 4, dur: 4, pitches: rh, lyric: lab }, { at: 12, dur: 4, pitches: rh }];
      }
      // 播放用:力度(拍子輕重 + 聲部層次)
      const notes = [];
      const nm = p => accPcName(p.li, ((p.midi % 12) + 12) % 12);
      rhEv.forEach(e => e.pitches.forEach((p, i) => notes.push({ at: e.at, dur: e.dur, midi: p.midi, hand: "R", nm: nm(p),
        vel: (e.at === 0 ? 64 : e.at % 4 === 0 ? 58 : 55) + (i === e.pitches.length - 1 ? 5 : 0) })));
      lhEv.forEach(e => e.pitches.forEach((p, i) => notes.push({ at: e.at, dur: e.dur, midi: p.midi, hand: "L", nm: nm(p),
        vel: (e.at === 0 ? 66 : e.at % 4 === 0 ? 56 : 50) - (i ? 6 : 0) })));
      const lhNames = [];
      for (const e of lhEv) for (const p of e.pitches) { const n = accPcName(p.li, ((p.midi % 12) + 12) % 12); if (!lhNames.includes(n)) lhNames.push(n); }
      return { chord: ch, notes, xml: [accNotesXml(rhEv, 1, 1), accNotesXml(lhEv, 2, 5)],
               info: { name: ch.name, roman: ch.roman, rootPc: ch.rootPc, rh: rh.map(p => accPcName(p.li, p.midi % 12)), rhLabel: lab, lh: lhNames,
                       rhMidi: [...new Set(notes.filter(n => n.hand === "R").map(n => n.midi))], lhMidi: [...new Set(notes.filter(n => n.hand === "L").map(n => n.midi))] } };
    };
    passChords.forEach((ch, i) => passBars.push(build(ch, rhs[i], false)));
    endBar = build(endChord, rhEnd, true);
    guide.steps = passBars.map(b => b.info).concat([endBar.info]);
    guide.steps[guide.steps.length - 1].end = true;
  } else {
    const allChords = passChords.concat([endChord]);
    plan = accGtrPlan(allChords);
    guide.capo = plan.capo;
    const patKey = ACC_GTR_PATTERNS[opts.pattern] ? opts.pattern : style.guitar, pat = ACC_GTR_PATTERNS[patKey];
    guide.pattern = patKey;
    const build = (ch, shape, last) => {
      const noteOn = s => { const midi = ACC_GTR_OPEN_MIDI[s] + shape.frets[s] + plan.capo; return { midi, li: accLetterFor(midi, ch, key), str: s, fret: shape.frets[s] }; };
      let evs;
      if (last) {
        const all = shape.frets.map((f, s) => f >= 0 ? noteOn(s) : null).filter(Boolean);
        evs = [{ at: 0, dur: 16, pitches: all, lyric: L("掃弦", "strum") }];
      } else {
        evs = pat.seq.map(([at, dur, tok]) => ({ at, dur, pitches: [noteOn(accGtrStringFor(tok, shape.frets))], lyric: tok === "T'" ? "T" : tok, tok }));
      }
      const notes = [];
      evs.forEach(e => e.pitches.forEach((p, i) => notes.push({ at: e.at, dur: e.dur, midi: p.midi, str: p.str, tok: last ? "S" : e.tok === "T'" ? "T" : e.tok,
        strum: last ? i * 0.016 : 0,
        vel: last ? 84 - i : (e.tok === "T" || e.tok === "T'" ? (e.at === 0 ? 92 : 84) : (e.at % 4 === 0 ? 80 : 74)) })));
      // 上面五線譜(實際音高 + 8vb 譜號、T123),下面六線譜(格數照指型、相對移調夾)
      return { chord: ch, shape, notes, xml: [accNotesXml(evs, 1, 1), accNotesXml(evs, 2, 5, true)] };
    };
    passChords.forEach((ch, i) => passBars.push(build(ch, plan.shapes[i], false)));
    endBar = build(endChord, plan.shapes[plan.shapes.length - 1], true);
    // 每一步一張卡片(反覆時每遍都一樣):指型、手指、每條弦由右手哪根手指撥
    guide.steps = passBars.concat([endBar]).map((b, i) => {
      const rh = {};
      for (const n of b.notes) if (!(rh[n.str] || []).includes(n.tok)) (rh[n.str] = rh[n.str] || []).push(n.tok);
      return { name: b.chord.name, roman: b.chord.roman, rootPc: b.chord.rootPc, shapeName: accShapeName(b.chord, plan.capo),
               frets: b.shape.frets, fingers: b.shape.fingers, rh, bassString: 6 - b.shape.frets.findIndex(f => f >= 0), end: i === passBars.length };
    });
    guide.shapeNames = [...new Set(guide.steps.map(x => x.shapeName))];
  }

  const bars = [];
  for (let l = 0; l < loops; l++) passBars.forEach((b, i) => bars.push({ ...b, step: i }));
  bars.push({ ...endBar, step: passBars.length });

  const styleName = L(style.zh, style.en);
  const instName = isGtr ? L("吉他", "Guitar") : L("鋼琴", "Piano");
  const title = `${styleName} · ${romans.join("–")} · ${keyName} · ${instName}`;
  const attrs = `<attributes><divisions>4</divisions><key><fifths>${key.fifths}</fifths><mode>${key.mode}</mode></key><time><beats>4</beats><beat-type>4</beat-type></time>`
    + (isGtr ? `<staves>2</staves><clef number="1"><sign>G</sign><line>2</line><clef-octave-change>-1</clef-octave-change></clef>`
             + `<clef number="2"><sign>TAB</sign><line>5</line></clef><staff-details number="2"><staff-lines>6</staff-lines>`
             + ["E2","A2","D3","G3","B3","E4"].map((t, i) => `<staff-tuning line="${i + 1}"><tuning-step>${t[0]}</tuning-step><tuning-octave>${t[1]}</tuning-octave></staff-tuning>`).join("")
             + (plan.capo ? `<capo>${plan.capo}</capo>` : "") + `</staff-details>`
             : `<staves>2</staves><clef number="1"><sign>G</sign><line>2</line></clef><clef number="2"><sign>F</sign><line>4</line></clef>`) + `</attributes>`;
  const tempoXml = `<direction placement="above"><direction-type><metronome><beat-unit>quarter</beat-unit><per-minute>${opts.tempo}</per-minute></metronome></direction-type>`
    + `<sound tempo="${opts.tempo}"/></direction>`;
  // 移調夾標在第一小節第二個音上方(跟速度記號放在一起會黏成一串)
  const capoXml = isGtr && plan.capo ? `<direction placement="above"><direction-type><words>Capo ${plan.capo}</words></direction-type></direction>` : "";
  const body = bars.map((m, i) => {
    const last = i === bars.length - 1;
    const x0 = i === 0 && capoXml ? m.xml[0].replace("</note>", "</note>" + capoXml) : m.xml[0];
    return `<measure number="${i + 1}">${i === 0 ? attrs + tempoXml : ""}${accHarmonyXml(m.chord)}${x0}`
      + (m.xml[1] ? `<backup><duration>16</duration></backup>${m.xml[1]}` : "")
      + (last ? `<barline location="right"><bar-style>light-heavy</bar-style></barline>` : "") + `</measure>`;
  }).join("\n");
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
<score-partwise version="3.1"><work><work-title>${esc(title)}</work-title></work>
<part-list><score-part id="P1"><part-name>${isGtr ? "Guitar" : "Piano"}</part-name><score-instrument id="P1-I1"><instrument-name>${isGtr ? "Acoustic Guitar" : "Piano"}</instrument-name></score-instrument><midi-instrument id="P1-I1"><midi-program>${isGtr ? 26 : 1}</midi-program></midi-instrument></score-part></part-list>
<part id="P1">
${body}
</part></score-partwise>`;
  guide.title = title;
  return { xml, title, guide, bars, passLen: passBars.length, passNames: passChords.map(c => c.name), romans, endName: endChord.name };
}

/* ══ 音訊:母帶鏈路照 ScrollScore ══════════════════════════════════
   鋼琴/吉他 → 各自 EQ(+ 殘響)→ masterGain → 響度壓縮 → makeup → masterBus → 真峰值限幅器(AudioWorklet)→ masterOut
   限幅器上限 −1.3dBFS(4 倍超取樣量),真峰值 ≤ −1dBTP */
const MASTER = {
  compThreshold: -18, compKnee: 8, compRatio: 3, compAttack: 0.008, compRelease: 0.18, makeup: 1.82,
  ceilingDb: -1.3, lookahead: 0.005, release: 0.09, releaseSlow: 0.7
};

const MASTER_CEIL_RANGE = 2, MASTER_CEIL_KNEE = 0.708, MASTER_CEIL = 0.85;   // 曲線涵蓋 ±2、−3dBFS 起彎、上限 −1.4dBFS
function buildCeilingCurve(){
  const n = 8193, c = new Float32Array(n), T = MASTER_CEIL_KNEE, C = MASTER_CEIL;
  for (let i = 0; i < n; i++) {

    c[i] = a <= T ? x : Math.sign(x) * (T + (C - T) * Math.tanh((a - T) / (C - T)));
  }

}

let audioCtx = null, masterGain = null, masterBus = null, masterOut = null, masterLimiterNode = null, masterReady = Promise.resolve(false);

    const k = audioCtx.createGain(); k.gain.value = Math.SQRT2;   // 等功率擺位置中時 −3dB,補回來
    node.connect(k); k.connect(p); out = p;
  }
  out.connect(getGuitarBus());
  const s = audioCtx.createGain(); s.gain.value = GTR_VERB_SEND; node.connect(s); s.connect(getGuitarVerb());
}
/* str:第幾條弦(0 = 第 6 弦);releaseAt:同一條弦再撥、或換和弦時止音 */
function playGuitarNote(m, when, releaseAt, vel, str, seed){
  if (!gtrMan) return false;
  const now = audioCtx.currentTime;
  when = Math.max(when, now); releaseAt = Math.max(releaseAt, when + 0.04);
  const name = gtrSampleFor(m, gtrLayerFor(vel));
  if (!name) return false;
  const info = gtrMan.samples[name], buf = gtrBuf[name];
  const detune = ((seed || 0.5) - 0.5) * 3;   // ±1.5 音分,同一個音重彈不會一模一樣
  const rate = Math.pow(2, (m - info.root + detune / 100) / 12);
  const gain = GTR_GAIN * gtrVelGain(vel);
  const fret = m - ACC_GTR_OPEN_MIDI[str];
  const relTau = fret === 0 && str <= 2 ? 0.09 : 0.05;   // 低音空弦比較難止住
  const bufEnd = when + buf.duration / rate;
  const end = Math.min(bufEnd, releaseAt + relTau * 7);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.playbackRate.setValueAtTime(rate, when);
  // 力度明暗:鋼弦只有兩層錄音,高頻架補 ±6dB
  const hi = audioCtx.createBiquadFilter(); hi.type = "highshelf"; hi.frequency.value = Math.min(16000, 2200 * rate); hi.gain.value = (vel - 100) / 127 * 6;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, when);
  if (releaseAt < end) g.gain.setTargetAtTime(0, releaseAt, relTau);
  src.connect(hi); hi.connect(g);
  gtrConnect(g, (str - 2.5) * 0.048);   // 低音弦偏左、高音弦偏右
  src.start(when); src.stop(end + 0.05);
  scheduled.push(src);
  return true;
}
/* 預備拍:短促的節拍器聲(第一下較高) */
function playClick(when, accent){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "sine"; o.frequency.value = accent ? 1760 : 1320;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(accent ? 0.5 : 0.35, when + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0008, when + 0.07);
  o.connect(g); g.connect(masterBus);
  o.start(when); o.stop(when + 0.09);
  scheduled.push(o);
}

/* ══ 狀態與設定(存在 localStorage)══════════════════════════════ */
const state = Object.assign({ inst: "piano", style: "pop", prog: 0, tonic: "C", pattern: "", tempo: 0, loops: 2, loop: true, countIn: true, showScore: false },
  (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY) || "null") || {}; } catch (e) { return {}; } })());
function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify(state)); } catch (e) {} }
let curGen = null;
function curStyle(){ return ACC_STYLES.find(s => s.id === state.style) || ACC_STYLES[0]; }
function normalizeState(){
  const st = curStyle(); state.style = st.id;
  if (!st.progs[state.prog]) state.prog = 0;
  const mode = st.minor ? "minor" : "major";
  if (!ACC_KEYS[mode].some(k => k[0] === state.tonic)) state.tonic = st.minor ? "A" : "C";
  const pats = state.inst === "guitar" ? ACC_GTR_PATTERNS : ACC_PIANO_PATTERNS;
  if (!pats[state.pattern]) state.pattern = state.inst === "guitar" ? st.guitar : st.piano;
  state.tempo = Math.max(40, Math.min(220, Math.round(+state.tempo) || st.tempo));
  if (![1, 2, 3, 4].includes(+state.loops)) state.loops = 2;
  state.loops = +state.loops;
}
const opt = (v, text, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(text)}</option>`;
const keyLabel = (k, minor) => k.replace("#", "♯").replace(/^(.)b/, "$1♭") + (minor ? "m" : "");
function renderControls(){
  normalizeState();
  const st = curStyle(), mode = st.minor ? "minor" : "major";
  document.querySelectorAll("#instSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.inst === state.inst)));
  $("selStyle").innerHTML = ACC_STYLES.map(s => opt(s.id, L(s.zh, s.en), s.id === st.id)).join("");
  $("selProg").innerHTML = st.progs.map((p, i) => opt(i, L(p.zh, p.en), i === state.prog)).join("");
  $("selKey").innerHTML = ACC_KEYS[mode].map(([k]) => opt(k, keyLabel(k, st.minor), k === state.tonic)).join("");
  const pats = state.inst === "guitar" ? ACC_GTR_PATTERNS : ACC_PIANO_PATTERNS;
  $("selPattern").innerHTML = Object.entries(pats).map(([k, p]) => opt(k, L(p.zh, p.en), k === state.pattern)).join("");
  $("inpTempo").value = state.tempo;
  $("selLoops").innerHTML = [1, 2, 3, 4].map(n => opt(n, "×" + n, n === state.loops)).join("");
  $("loopBtn").setAttribute("aria-pressed", String(!!state.loop));
  $("countBtn").setAttribute("aria-pressed", String(!!state.countIn));
}

/* ══ 產生 → 預覽、練習卡片、指法說明、樂譜 ══
   主畫面是練習卡片:一步一張,鋼琴畫小鍵盤、吉他畫和弦圖,下方一排節奏格;播放時正在彈的鍵/弦再亮一層。
   樂譜是選用的(預設收起,打開時才載入 OSMD) */
let renderTimer = 0, scoreDirty = false, selStep = 0;
function regenerate(opts = {}){
  normalizeState();
  savePrefs();
  const keep = playing && opts.keepPlaying;   // 播放中換語言/速度:音符不變,繼續播
  if (playing && !keep) stop();
  curGen = accGenerate(state);
  selStep = Math.min(selStep, curGen.passLen);
  if (!keep && !opts.keepSel) selStep = 0;
  renderPreview();
  renderStage();
  renderLegend();
  $("scoreSub").textContent = curGen.title;
  if (keep) { scoreDirty = true; return; }
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderScore, opts.now ? 0 : 60);
}
function renderPreview(){
  const g = curGen;
  const chip = (name, roman, i) => `<span class="chip" role="button" tabindex="0" data-step="${i}">${esc(name)}<small>${esc(roman)}</small></span>`;
  $("chips").innerHTML = g.passNames.map((n, i) => chip(n, g.romans[i], i)).join("")
    + chip(g.endName, L("結尾", "end"), g.passLen);
  let hint = "";
  if (state.inst === "guitar") {
    const c = g.guide.capo, sh = g.guide.shapeNames;
    hint = c ? L(`建議移調夾 Capo ${c}:用 ${sh.join("、")} 的指型彈`, `Capo ${c} suggested — play the shapes ${sh.join(", ")}`)
             : L("不用移調夾,全部用開放把位的指型", "No capo needed — open-position shapes");
  }
  $("capoHint").textContent = hint;
}

/* ── 鋼琴小鍵盤:整組進行共用同一段(從 C 或 F 開始、到 E 或 B 結束,照 HarmonyMap),
   換和弦時鍵盤不動,看得出右手轉位只移動一兩個音。上方括號 = 右手、下方括號 = 左手 ── */
const isBlackKey = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
function kbWindow(gen){
  const all = [];
  for (const b of gen.bars) for (const n of b.notes) all.push(n.midi);
  let lo = Math.min(...all), hi = Math.max(...all);
  while (![0, 5].includes(((lo % 12) + 12) % 12)) lo--;
  while (![4, 11].includes(((hi % 12) + 12) % 12)) hi++;
  return { lo, hi };
}
function pianoKbSvg(st, win){
  const whites = [];
  for (let m = win.lo; m <= win.hi; m++) if (!isBlackKey(m)) whites.push(m);
  const ww = 14, bw = 9, bh = 34, kh = 56, top = 20, W = whites.length * ww, H = top + kh + 20;
  const on = m => st.rhMidi.includes(m) || st.lhMidi.includes(m);
  const cls = m => on(m) ? (((m % 12) + 12) % 12 === st.rootPc ? " r" : " t") : "";
  const edge = m => { if (!isBlackKey(m)) { const i = whites.indexOf(m); return [i * ww, i * ww + ww - 0.8]; }
                      const x = (whites.indexOf(m - 1) + 1) * ww - bw / 2 - 0.4; return [x, x + bw]; };
  let g = "";
  whites.forEach((m, i) => { g += `<rect class="w${cls(m)}" data-m="${m}" x="${i * ww}" y="${top}" width="${ww - 0.8}" height="${kh}" rx="1.5"/>`; });
  for (let m = win.lo; m <= win.hi; m++) if (isBlackKey(m) && whites.includes(m - 1)) {
    const [x] = edge(m);
    g += `<rect class="bk${cls(m)}" data-m="${m}" x="${x}" y="${top}" width="${bw}" height="${bh}" rx="1"/>`;
  }
  const bracket = (ms, y, d, label, ty) => {
    if (!ms.length) return "";
    const x1 = edge(Math.min(...ms))[0] + 1, x2 = edge(Math.max(...ms))[1] - 1;
    return `<path class="hb" d="M${x1} ${y + d * 4}V${y}H${x2}V${y + d * 4}"/><text class="hl" x="${(x1 + x2) / 2}" y="${ty}">${esc(label)}</text>`;
  };
  // 右手括號在鍵盤上方、左手在下方(左右手可能在中央 C 附近重疊,分開上下才不會疊在一起)
  g += bracket(st.rhMidi, top - 3, 1, L("右手", "RH"), top - 7);
  g += bracket(st.lhMidi, top + kh + 3, -1, L("左手", "LH"), top + kh + 16);
  return `<svg class="kb" viewBox="0 -2 ${W} ${H + 2}" role="img" aria-label="${esc(st.rh.join(" ") + " / " + st.lh.join(" "))}">${g}</svg>`;
}
/* ── 吉他和弦圖(照 HarmonyMap 的 voicingSVG):6 弦在左;點 = 左手手指,顏色依音(根音金、其他青);
   下方標右手撥這條弦的手指(T 1 2 3);播放時被撥的弦亮起來 ── */
function gtrSvg(st, capo){
  const { frets, fingers, rh } = st;
  const fr = frets.filter(f => f > 0), maxF = fr.length ? Math.max(...fr) : 0, minF = fr.length ? Math.min(...fr) : 1;
  const base = maxF <= 4 ? 1 : minF;
  const x0 = 24, gap = 20, y0 = 30, rowH = 22, rows = 5, W = x0 + gap * 5 + 30, yB = y0 + rowH * rows, H = yB + 30;
  const xs = s => x0 + s * gap, yOf = f => y0 + (f - base + 0.5) * rowH;
  const col = s => ((ACC_GTR_OPEN_MIDI[s] + frets[s] + capo) % 12 === st.rootPc ? "var(--note-gold)" : "var(--note-teal)");
  let g = `<rect class="bg" x="${x0}" y="${y0}" width="${gap * 5}" height="${rowH * rows}"/>`;
  for (let r = 1; r <= rows; r++) g += `<line class="ln" x1="${x0}" x2="${x0 + gap * 5}" y1="${y0 + r * rowH}" y2="${y0 + r * rowH}"/>`;
  for (let s = 0; s < 6; s++) g += `<line class="str" data-s="${s}" x1="${xs(s)}" x2="${xs(s)}" y1="${y0}" y2="${yB}" stroke-width="${(1.8 - s * 0.2).toFixed(1)}"/>`;
  g += `<line class="nut" x1="${x0 - 0.9}" x2="${x0 + gap * 5 + 0.9}" y1="${y0}" y2="${y0}" stroke-width="${base === 1 ? 3.5 : 2.6}"/>`;
  if (base > 1) g += `<text class="fr" x="${x0 + gap * 5 + 8}" y="${y0 + rowH * 0.5 + 4}">${base}fr</text>`;
  // 封閉和弦:食指同一格按兩條弦以上畫橫槓
  const ones = frets.map((f, i) => f > 0 && fingers[i] === 1 ? i : -1).filter(i => i >= 0);
  if (ones.length >= 2 && ones.every(i => frets[i] === frets[ones[0]])) {
    const a = xs(ones[0]), b = xs(ones[ones.length - 1]), y = yOf(frets[ones[0]]);
    g += `<rect class="brr" x="${a - 7}" y="${y - 7}" width="${b - a + 14}" height="14" rx="7"/>`;
  }
  frets.forEach((f, s) => {
    if (f < 0) g += `<text class="mx" x="${xs(s)}" y="${y0 - 9}">×</text>`;
    else if (f === 0) g += `<circle class="od" data-s="${s}" cx="${xs(s)}" cy="${y0 - 13}" r="5" fill="none" stroke="${col(s)}" stroke-width="1.8"/>`;
    else {
      g += `<circle class="fd" data-s="${s}" cx="${xs(s)}" cy="${yOf(f)}" r="7.5" fill="${col(s)}"/>`;
      if (fingers[s]) g += `<text class="fn" x="${xs(s)}" y="${yOf(f) + 3.6}">${fingers[s]}</text>`;
    }
  });
  if (st.end) g += `<text class="tokl" x="${x0 + gap * 2.5}" y="${yB + 20}">${esc(L("↓ 掃弦", "↓ strum"))}</text>`;
  else for (let s = 0; s < 6; s++) if (rh[s]) g += `<text class="tok" data-s="${s}" x="${xs(s)}" y="${yB + 20}">${rh[s].join("")}</text>`;
  return `<svg class="gb" viewBox="0 0 ${W} ${H}" role="img" aria-label="${frets.map(f => f < 0 ? "x" : f).join(" ")}">${g}</svg>`;
}
let hlStep = -1, hitSig = "", gridCell = -1;
function renderStage(){
  const g = curGen, gd = g.guide;
  let h;
  if (gd.inst === "guitar") {
    h = gd.steps.map((st, i) => `<div class="scard" role="button" tabindex="0" data-step="${i}">`
      + `<div class="scard-name">${esc(st.shapeName)}</div>`
      + `<div class="scard-sub">${esc(gd.capo ? L(`實際 ${st.name}`, `sounds ${st.name}`) : st.end ? L("結尾", "ending") : st.roman)}</div>`
      + gtrSvg(st, gd.capo)
      + `<div class="scard-sub foot">${esc(L(`T 彈第 ${st.bassString} 弦`, `T on string ${st.bassString}`))}</div></div>`).join("");
    $("stageSub").textContent = (gd.capo ? `Capo ${gd.capo} · ` : "") + L("點卡片聽和弦", "Tap a card to hear it");
  } else {
    const win = kbWindow(g);
    h = gd.steps.map((st, i) => `<div class="scard" role="button" tabindex="0" data-step="${i}">`
      + `<div class="scard-name">${esc(st.name)}</div>`
      + `<div class="scard-sub">${esc(st.end ? L("結尾", "ending") : st.roman)}</div>`
      + pianoKbSvg(st, win)
      + `<div class="scard-row"><span>${esc(L("右手", "RH"))}</span><i>${esc(st.rh.join(" "))}</i><em>${esc(st.rhLabel)}</em></div>`
      + `<div class="scard-row"><span>${esc(L("左手", "LH"))}</span><i>${esc(st.lh.join(" "))}</i></div></div>`).join("");
    $("stageSub").textContent = L("點卡片聽和弦", "Tap a card to hear it");
  }
  $("stageRow").innerHTML = h;
  hlStep = -1; hitSig = ""; gridCell = -1;
  setActiveStep(playing ? Math.max(0, hlStep) : selStep, false);
  window.__stageReady = (window.__stageReady || 0) + 1;
}
function stepBar(step){ const g = curGen; return step >= g.passLen ? g.bars[g.bars.length - 1] : g.bars[step]; }
function gridSize(){ return curGen.bars.some(b => b.notes.some(n => n.at % 2)) ? 16 : 8; }
/* 一小節的節奏格:鋼琴兩排(右手 ● / 左手音名)、吉他一排(右手手指 + 第幾弦);延長中的格子淡淡上色 */
function renderGrid(step){
  const bar = stepBar(step), n = gridSize(), u = 16 / n, isG = curGen.guide.inst === "guitar";
  const heads = n === 8 ? ["1", "&", "2", "&", "3", "&", "4", "&"] : ["1", "e", "&", "a", "2", "e", "&", "a", "3", "e", "&", "a", "4", "e", "&", "a"];
  let h = `<span class="lab"></span>` + heads.map((x, i) => `<span class="h${i % (n / 4) === 0 ? " beat" : ""}">${x}</span>`).join("");
  const rows = isG ? [["G", L("右手", "RH")]] : [["R", L("右手", "RH")], ["L", L("左手", "LH")]];
  for (const [hand, label] of rows) {
    h += `<span class="lab">${esc(label)}</span>`;
    const mine = bar.notes.filter(x => isG || x.hand === hand);
    for (let c = 0; c < n; c++) {
      const at = mine.filter(x => x.at >= c * u && x.at < (c + 1) * u);
      const hold = !at.length && mine.some(x => x.at < c * u && x.at + x.dur > c * u);
      let txt = "";
      if (at.length) {
        if (isG) txt = at[0].tok === "S" ? "↓" : `${at[0].tok}<small>${6 - at[0].str}</small>`;
        else if (hand === "R") txt = "●";
        else txt = [...new Set(at.map(x => x.nm))].join("");
      }
      h += `<span class="c${at.length ? " on" : hold ? " hold" : ""}" data-c="${c}">${txt}</span>`;
    }
  }
  const el = $("grid");
  el.style.setProperty("--n", n);
  el.innerHTML = h;
  el.setAttribute("aria-label", isG ? L("右手節奏:T 1 2 3,小字是第幾弦", "Right-hand rhythm: T 1 2 3, small digits = string") : L("左右手節奏", "Rhythm of both hands"));
  gridCell = -1;
}
function setActiveStep(step, scroll){
  if (step === hlStep) return;
  hlStep = step;
  document.querySelectorAll("#chips .chip").forEach(el => el.classList.toggle("on", +el.dataset.step === step));
  const cards = $("stageRow").children;
  for (const el of cards) el.classList.toggle("on", +el.dataset.step === step);
  clearHits();
  renderGrid(step);
  const card = cards[step], row = $("stageRow");
  if (scroll && card && row.scrollWidth > row.clientWidth + 2) {
    row.scrollTo({ left: Math.max(0, card.offsetLeft - row.offsetLeft - (row.clientWidth - card.clientWidth) / 2), behavior: "smooth" });
  }
}
function clearHits(){
  hitSig = "";
  document.querySelectorAll("#stageRow .hit").forEach(el => el.classList.remove("hit"));
}
function showHits(step, list){   // list:[{m, s}]
  const sig = step + ":" + list.map(e => e.m + "/" + e.s).join(",");
  if (sig === hitSig) return;
  clearHits(); hitSig = sig;
  const card = $("stageRow").children[step];
  if (!card) return;
  for (const e of list) {
    const sel = e.s != null ? `[data-s="${e.s}"]` : `[data-m="${e.m}"]`;
    card.querySelectorAll(sel).forEach(el => el.classList.add("hit"));
  }
}
function markGridCell(c){
  if (c === gridCell) return;
  gridCell = c;
  document.querySelectorAll("#grid .c").forEach(el => el.classList.toggle("now", +el.dataset.c === c));
}
function selectStep(step){
  selStep = step;
  if (!playing) setActiveStep(step, true);
  audition(step);
}
$("stageRow").addEventListener("click", e => { const c = e.target.closest(".scard"); if (c) selectStep(+c.dataset.step); });
$("chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) selectStep(+c.dataset.step); });
for (const id of ["stageRow", "chips"]) $(id).addEventListener("keydown", e => {
  const c = e.target.closest("[data-step]");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); selectStep(+c.dataset.step); }
});
/* 點卡片聽這個和弦:鋼琴整個按下去、吉他從低音弦刷下去 */
let auditionToken = 0;
async function audition(step){
  if (playing) return;
  const gen = curGen, token = ++auditionToken, isG = gen.guide.inst === "guitar";
  ensureAudio();
  try { await audioCtx.resume(); } catch (e) {}
  try { await loadSamplesFor(gen, p => { if (token === auditionToken) setStatus(T(isG ? "loadingGuitar" : "loadingPiano", { pct: Math.round(p * 100) })); }); }
  catch (e) { if (token === auditionToken) setStatus(T("loadFail")); return; }
  if (token !== auditionToken || playing || gen !== curGen) return;
  setStatus(T("ready"));
  masterOut.gain.cancelScheduledValues(0); masterOut.gain.value = 1;
  const bar = stepBar(step), t = audioCtx.currentTime + 0.04;
  const hits = [];
  if (isG) {
    const byStr = new Map();
    for (const n of bar.notes) if (!byStr.has(n.str)) byStr.set(n.str, n.midi);
    [...byStr.entries()].sort((a, b) => a[0] - b[0]).forEach(([s, m], i) => { playGuitarNote(m, t + i * 0.022, t + 2.2, 84, s, 0.5); hits.push({ s }); });
  } else {
    [...new Set(bar.notes.map(n => n.midi))].sort((a, b) => a - b).forEach((m, i) => { playPianoNote(m, t + i * 0.006, t + 1.4, t + 1.8, 62, true); hits.push({ m }); });
  }
  showHits(step, hits);
  setTimeout(() => { if (!playing && token === auditionToken) clearHits(); }, 900);
}

function renderLegend(){
  const g = curGen.guide;
  let h = "";
  const tag = x => `<span class="t">${x}</span>`;
  if (g.inst === "guitar") {
    const pat = ACC_GTR_PATTERNS[g.pattern];
    if (g.capo) h += `<div class="legend"><b>${esc(L(`移調夾夾第 ${g.capo} 格`, `Capo on fret ${g.capo}`))}</b> — ${esc(L("卡片上的大字是指型,小字是實際和弦。", "the big name on each card is the shape; the small one is the sounding chord."))}</div>`;
    h += `<div class="legend"><b>${esc(L("右手", "Right hand"))}</b> ${esc(L(pat.zh, pat.en))}<br>`

                       "Rhythm grid: one cell per note — big = right-hand finger, small = string number. While playing, the current cell and the plucked string light up. A string rings until plucked again; release when the chord changes."))

      + esc(L("右手轉位怎麼選:換和弦時,兩個和弦共同的音按住不動,其他音往最近的和弦音移動,所以右手不會一直彈原位,而是在同一個音域裡用轉位接起來(卡片上標了每個和弦用的轉位)。",
              "Choosing RH inversions: keep the common tones, move the other notes to the nearest chord tone, so the right hand stays in one area using inversions (each card shows which one)."))
      + (g.pattern === "jazz" ? "<br>" + esc(L("爵士右手不彈根音(左手已經有了):A 型由 3 音起、B 型由 7 音起,交替使用讓聲部平順。", "Jazz RH leaves out the root (the LH has it): type A starts on the 3rd, type B on the 7th, alternating for smooth voice-leading.")) : "")
      + "<br>" + esc(L("鍵盤:金色是根音、青色是其他和弦音;上方括號是右手、下方括號是左手;每張卡片的鍵盤是同一段,看得出手怎麼移。播放時再亮一層的是正在彈的鍵。節奏格:● 是右手和弦、下排是左手彈的音。",
                       "Keyboard: gold = root, teal = other chord tones; the bracket above is the right hand, below is the left hand; every card shows the same stretch of keys so you can see how the hands move. Keys that light up brighter are sounding now. Rhythm grid: ● = right-hand chord, bottom row = left-hand notes."))
      + `</div>`;
    $("guideSub").textContent = L("右手轉位・左手型態", "RH inversions · LH pattern");
  }
  $("guide").innerHTML = h;
}

/* ── 樂譜(選用):OSMD 2.0.0 打開時才從 jsdelivr 載入;鋼琴大譜表,吉他五線譜 + 六線譜 ── */
const OSMD_URL = "https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.0.0/build/opensheetmusicdisplay.min.js";
let osmd = null, osmdLib = null, cursorSteps = [], cursorIdx = 0, osmdZoom = 0;
function loadOsmdLib(){
  if (typeof opensheetmusicdisplay !== "undefined") return Promise.resolve();
  if (!osmdLib) osmdLib = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = OSMD_URL; sc.onload = res; sc.onerror = () => { osmdLib = null; sc.remove(); rej(new Error("osmd")); };
    document.head.appendChild(sc);
  });
  return osmdLib;
}
function osmdZoomFor(){ const w = $("osmd").clientWidth || innerWidth; return w < 420 ? 0.5 : w < 700 ? 0.66 : 0.9; }
function applyScoreToggle(){
  $("paper").hidden = !state.showScore;
  $("scoreToggle").setAttribute("aria-expanded", String(!!state.showScore));
  $("scoreToggleLabel").textContent = T(state.showScore ? "scoreHide" : "scoreShow");
}
$("scoreToggle").addEventListener("click", () => {
  state.showScore = !state.showScore; savePrefs(); applyScoreToggle();
  if (state.showScore) renderScore();
});
async function renderScore(){
  if (!state.showScore || !curGen) return;
  const xml = curGen.xml;
  if (osmd && osmd.__xml === xml) return;
  $("paperMsg").textContent = T("rendering");
  try { await loadOsmdLib(); } catch (e) { $("paperMsg").textContent = T("osmdFail"); return; }
  if (xml !== curGen.xml || !state.showScore) return;
  try {
    if (!osmd) osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay($("osmd"), {
      autoResize: false, backend: "svg", drawTitle: false, drawSubtitle: false, drawComposer: false, drawLyricist: false,
      drawPartNames: false, drawPartAbbreviations: false, drawCredits: false, drawMeasureNumbers: true,
      followCursor: false, cursorsOptions: [{ type: 0, color: "#F2B94B", alpha: 0.55, follow: false }],
      defaultColorMusic: "#16130D", pageBackgroundColor: "#FFFDF600"
    });
    await osmd.load(xml);
    if (xml !== curGen.xml) return;   // 載入期間又改了設定
    osmdZoom = osmd.zoom = osmdZoomFor();
    osmd.render();
    osmd.__xml = xml;
    collectCursorSteps();
    $("paperMsg").textContent = "";
    window.__scoreReady = (window.__scoreReady || 0) + 1;
  } catch (e) {
    console.error(e);
    $("paperMsg").textContent = String(e && e.message || e);
  }
}
/* 畫完後走一遍游標,記下每一步的時間點(全音符為單位;一小節 = 1),播放時對時間找位置 */
function collectCursorSteps(){
  const c = osmd.cursor;
  if (!c) { cursorSteps = []; return; }
  c.show(); c.reset();
  cursorSteps = [];
  let guard = 0;
  while (!c.Iterator.EndReached && guard++ < 5000) { cursorSteps.push(c.Iterator.currentTimeStamp.RealValue); c.next(); }
  c.reset(); cursorIdx = 0;
}
function moveCursorTo(idx){
  const c = osmd && osmd.cursor;
  if (!c || !cursorSteps.length) return false;
  idx = Math.max(0, Math.min(cursorSteps.length - 1, idx));
  if (idx === cursorIdx) return false;
  if (idx < cursorIdx) { c.reset(); cursorIdx = 0; }
  while (cursorIdx < idx) { c.next(); cursorIdx++; }
  return true;
}
const headerBottom = () => document.querySelector("header").getBoundingClientRect().bottom;
function inView(el){ const r = el.getBoundingClientRect(); return r.bottom > headerBottom() + 40 && r.top < innerHeight - 40; }
// 練習卡片看得到時以卡片為主,不捲頁面;使用者捲到樂譜那裡(卡片看不到)才讓頁面跟著游標
function keepCursorVisible(){
  if (inView($("stageCard"))) return;
  const el = osmd && osmd.cursor && osmd.cursor.cursorElement;
  if (!el) return;
  const r = el.getBoundingClientRect(), top = headerBottom() + 8;
  if (r.height && (r.top < top || r.bottom > innerHeight - 12)) {
    window.scrollTo({ top: Math.max(0, scrollY + r.top - top - Math.max(24, (innerHeight - top) * 0.25)), behavior: "smooth" });
  }
}
function ensureStageVisible(){
  const r = $("stageCard").getBoundingClientRect(), top = headerBottom();
  if (r.top < top || r.top > innerHeight * 0.45) window.scrollTo({ top: Math.max(0, scrollY + r.top - top - 8), behavior: "smooth" });
}
let resizeTimer = 0;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!osmd || !curGen || !state.showScore || osmd.__xml !== curGen.xml) return;
    const z = osmdZoomFor();
    if (z !== osmdZoom) osmdZoom = osmd.zoom = z;
    try { osmd.render(); const k = cursorIdx; collectCursorSteps(); if (playing) moveCursorTo(k); } catch (e) {}
  }, 200);
});

/* ══ 播放:每小節一個和弦,往前排程 0.6 秒 ══════════════════════
   鋼琴:左手的分解音在小節內延音(像踩踏板),換和弦時放開;爵士/Boogie 不踩踏板(爵士右手半踏板)
   吉他:同一條弦再撥時才止住前一個音,換和弦時放開 */
let playing = false, schedTimer = 0, rafId = 0, nextBarTime = 0, nextBar = 0, playEnd = Infinity, timeline = [], playToken = 0, visEvents = [];
function seeded(a, b){ let t = (a * 374761393 + b * 668265263) | 0; t = Math.imul(t ^ t >>> 13, 1274126177); return ((t ^ t >>> 16) >>> 0) / 4294967296; }
function barSecOf(tempo){ return 60 / tempo * 4; }
function nextBarIndex(bi, loop){ return bi + 1 < curGen.bars.length ? bi + 1 : (loop ? 0 : null); }
function scheduleBar(gen, bi, t, tempo, loop, pass, vis){
  const bar = gen.bars[bi], s16 = 60 / tempo / 4, barSec = 16 * s16, last = bi === gen.bars.length - 1;
  const nb = nextBarIndex(bi, loop);
  const show = (n, when) => { if (vis) visEvents.push({ bi, m: n.midi, s: n.str, t0: when, t1: when + Math.max(0.12, n.dur * s16 * 0.92) }); };
  if (gen.guide.inst === "piano") {
    const pat = gen.guide.pattern, pedal = ACC_PIANO_PATTERNS[pat].pedal;
    const barEnd = t + barSec + (last && !loop ? 1.6 : 0.03);
    bar.notes.forEach((n, k) => {
      const r = seeded(bi * 97 + pass * 7919, k);
      const when = t + n.at * s16 + (n.at ? 0.004 : 0) + (n.hand === "R" ? r * 0.008 : r * 0.004);
      const keyUp = t + (n.at + n.dur) * s16 - 0.012;
      const vel = Math.max(20, Math.min(110, n.vel + (r - 0.5) * 6));
      let damper = keyUp, ped = false;
      if (pedal || last) { damper = barEnd; ped = true; }
      else if (pat === "jazz" || n.hand === "R") damper = barEnd;   // 半踏板:放鍵後還有一點餘音
      playPianoNote(n.midi, when, keyUp, damper, vel, ped);
      show({ ...n, str: null }, when);
    });
  } else {
    const nextBarObj = nb != null ? gen.bars[nb] : null, sameNext = nextBarObj && nextBarObj.chord.name === bar.chord.name;
    bar.notes.forEach((n, k) => {
      const r = seeded(bi * 131 + pass * 7919, k);
      const when = t + n.at * s16 + n.strum + r * 0.006;
      let rel;
      const again = bar.notes.find(x => x.str === n.str && x.at > n.at);
      if (again) rel = t + again.at * s16;
      else if (last) rel = t + barSec + (loop ? 0.02 : 1.6);
      else if (sameNext) { const a2 = nextBarObj.notes.find(x => x.str === n.str); rel = t + barSec + (a2 ? a2.at * s16 : barSec); }
      else rel = t + barSec + 0.02;   // 換和弦:左手放開
      const vel = Math.max(30, Math.min(120, n.vel + (r - 0.5) * 8));
      playGuitarNote(n.midi, when, rel, vel, n.str, r);
      show(n, when);
    });
  }
  return barSec;
}
function schedTick(){
  if (!playing) return;
  const now = audioCtx.currentTime;
  while (nextBar != null && nextBarTime < now + 0.6) {
    const pass = timeline.filter(x => x.bi === nextBar).length;
    const barSec = scheduleBar(curGen, nextBar, nextBarTime, state.tempo, state.loop, pass, true);
    timeline.push({ bi: nextBar, t: nextBarTime, sec: barSec });
    if (timeline.length > 64) timeline.shift();
    nextBarTime += barSec;
    const nb = nextBarIndex(nextBar, state.loop);
    if (nb == null) { playEnd = nextBarTime; nextBar = null; }
    else nextBar = nb;
  }
  if (nextBar == null && now > playEnd + 0.4) stop();
}
function visualTick(){
  if (!playing) return;
  rafId = requestAnimationFrame(visualTick);
  const now = audioCtx.currentTime - (audioCtx.outputLatency || 0);
  let cur = null;
  for (const x of timeline) if (x.t <= now) cur = x;
  if (!cur) return;
  const step = curGen.bars[cur.bi].step;
  setActiveStep(step, true);
  const pos = Math.min(0.999, (now - cur.t) / cur.sec);
  const n = gridSize();
  markGridCell(Math.floor(pos * n));
  visEvents = visEvents.filter(e => e.t1 > now - 1);
  showHits(step, visEvents.filter(e => e.bi === cur.bi && e.t0 <= now && now < e.t1));
  if (state.showScore && osmd && cursorSteps.length) {
    const wholes = cur.bi + pos;
    let k = 0;
    while (k + 1 < cursorSteps.length && cursorSteps[k + 1] <= wholes + 1e-6) k++;
    if (moveCursorTo(k)) keepCursorVisible();
  }
}
function setStatus(s){ $("status").textContent = s || ""; }
function setPlayUI(on){
  $("playLabel").textContent = T(on ? "stop" : "play");
  const icon = on ? '<rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/>' : '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>';
  $("playIcon").innerHTML = icon; $("stagePlayIcon").innerHTML = icon;
  $("stagePlay").setAttribute("aria-label", T(on ? "stop" : "play")); $("stagePlay").title = T(on ? "stop" : "play");
}
async function loadSamplesFor(gen, onProgress){
  if (gen.guide.inst === "guitar") await loadGuitarFor(gen, onProgress);
  else await loadPianoFor(gen, Math.min(16, barSecOf(Math.min(state.tempo, 200)) + 2.5), onProgress);
  await masterReady;
}
async function play(){
  if (playing) { stop(); return; }
  ensureAudio();
  try { await audioCtx.resume(); } catch (e) {}
  playing = true; setPlayUI(true); auditionToken++;
  ensureStageVisible();
  const token = ++playToken, gen = curGen;
  const isG = gen.guide.inst === "guitar";
  setStatus(T(isG ? "loadingGuitar" : "loadingPiano", { pct: 0 }));
  try {
    await loadSamplesFor(gen, p => { if (token === playToken) setStatus(T(isG ? "loadingGuitar" : "loadingPiano", { pct: Math.round(p * 100) })); });
  } catch (e) {
    console.error(e);
    if (token === playToken) { playing = false; setPlayUI(false); setStatus(T("loadFail")); }
    return;
  }
  if (!playing || token !== playToken || gen !== curGen) return;
  setStatus(T("ready"));
  masterOut.gain.cancelScheduledValues(0); masterOut.gain.value = 1;
  pianoLastByKey = {}; gtrRR = {};
  $("stageRow").classList.add("playing");
  const beat = 60 / state.tempo;
  let t = audioCtx.currentTime + 0.12;
  if (state.countIn) { for (let i = 0; i < 4; i++) playClick(t + i * beat, i === 0); t += 4 * beat; }
  nextBarTime = t; nextBar = 0; playEnd = Infinity; timeline = []; visEvents = [];
  if (osmd && osmd.cursor) { osmd.cursor.reset(); cursorIdx = 0; osmd.cursor.show(); }
  schedTick();
  schedTimer = setInterval(schedTick, 40);
  rafId = requestAnimationFrame(visualTick);
}
function stop(){
  playToken++;
  const was = playing;
  playing = false;
  clearInterval(schedTimer); cancelAnimationFrame(rafId);
  setPlayUI(false);
  if (audioCtx && masterOut && was) {
    const now = audioCtx.currentTime, list = scheduled;
    scheduled = [];
    masterOut.gain.cancelScheduledValues(now);
    masterOut.gain.setValueAtTime(masterOut.gain.value, now);
    masterOut.gain.setTargetAtTime(0, now, 0.03);
    for (const n of list) { try { n.stop(now + 0.2); } catch (e) {} }
    setTimeout(() => { if (!playing && audioCtx) { masterOut.gain.cancelScheduledValues(0); masterOut.gain.value = 1; } }, 260);
  }
  visEvents = []; clearHits(); markGridCell(-1); hlStep = -1;
  $("stageRow").classList.remove("playing");
  if (curGen) setActiveStep(selStep, false);
  if (osmd && osmd.cursor) { try { osmd.cursor.reset(); cursorIdx = 0; } catch (e) {} }
  if (scoreDirty) { scoreDirty = false; renderScore(); }
}

/* 離線渲染(測試用:量響度/真峰值):跟播放同一條音訊路徑,用 OfflineAudioContext 算出 seconds 秒 */
async function renderOffline(seconds, sr = 48000){
  if (playing) stop();
  const live = audioCtx;
  audioCtx = new OfflineAudioContext(2, Math.ceil(sr * seconds), sr);
  buildMaster();
  try {
    await masterReady;
    await loadSamplesFor(curGen);
    pianoLastByKey = {}; gtrRR = {};
    let t = 0.05, bi = 0, pass = 0;
    while (t < seconds) {
      t += scheduleBar(curGen, bi, t, state.tempo, true, pass, false);
      bi = nextBarIndex(bi, true); if (bi === 0) pass++;
    }
    const buf = await audioCtx.startRendering();
    return buf;
  } finally { scheduled = []; audioCtx = live; if (live) buildMaster(); }
}

});
$("countBtn").addEventListener("click", () => { state.countIn = !state.countIn; $("countBtn").setAttribute("aria-pressed", String(state.countIn)); savePrefs(); });
$("playBtn").addEventListener("click", play);
$("stagePlay").addEventListener("click", play);
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); play(); }
});

applyTheme();
applyLanguage(LANG);
applyScoreToggle();
regenerate({ now: true });
// 先抓 manifest(很小),按播放時少等一點
loadPianoManifest().catch(() => {}); loadGuitarManifest().catch(() => {});
</script>
</body>
</html>
